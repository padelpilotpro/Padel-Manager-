<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background: #f8fafc; font-family: Inter, system-ui, sans-serif; color: #0f172a; }
    .match-card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px -2px rgb(0 0 0 / 0.1);
    }
    .team-block {
      width: 38%;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }
    .top-tabs {
      background: linear-gradient(90deg, #1e40af, #3b82f6);
      padding: 14px; 
      display: flex; 
      justify-content: center; 
      gap: 40px;
      color: white; 
      font-weight: 700;
    }
    .score-input {
      width: 75px;
      height: 55px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="top-tabs">
  <a href="index.html">ARENA</a>
  <a href="leaderboard.html">LEADERBOARD</a>
</div>

<div class="max-w-4xl mx-auto px-5 py-8 space-y-8">

  <div class="text-center py-6 space-y-1">
    <div class="text-4xl font-black tracking-widest text-gray-900">PADELPILOT</div>
    <div class="text-blue-600 text-3xl font-bold">Arena</div>
    <div id="roundCounter" class="text-2xl font-bold text-amber-600 mt-2">Round 1</div>
  </div>

  <!-- Tournament Setup -->
  <div class="bg-white border rounded-3xl p-8 shadow-sm space-y-6">
    <input id="tournamentName" class="w-full p-5 border rounded-2xl text-xl" placeholder="Tournament Name">
    <div class="grid grid-cols-2 gap-6">
      <input id="tournamentLocation" class="w-full p-5 border rounded-2xl" placeholder="Location">
      <input id="tournamentTime" type="time" class="w-full p-5 border rounded-2xl">
    </div>
    <button onclick="createTournament()" class="w-full bg-blue-600 text-white py-5 rounded-3xl font-bold text-xl">
      Create / Save Tournament
    </button>
  </div>

  <!-- Share -->
  <div class="bg-white border rounded-3xl p-6">
    <div class="flex gap-3">
      <input id="shareLink" class="flex-1 p-5 border rounded-3xl bg-gray-50" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-6 rounded-3xl">Copy</button>
    </div>
  </div>

  <!-- Add Player -->
  <div class="flex gap-3">
    <input id="playerInput" class="flex-1 p-5 border rounded-3xl" placeholder="Player name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-6 rounded-3xl">Add</button>
  </div>

  <!-- Players -->
  <div class="bg-white rounded-3xl border p-6">
    <div>Players • <span id="playerCount">0</span></div>
    <div id="playersList"></div>
  </div>

  <!-- Courts -->
  <div class="bg-white border rounded-3xl p-6 flex gap-4">
    <input id="courtsInput" type="number" value="1" min="1" class="w-full p-5 border rounded-2xl text-center" onchange="saveData()">
    <button onclick="generateMatches()" class="w-full bg-orange-500 text-white rounded-3xl text-xl">Generate</button>
  </div>

  <!-- Resting -->
  <div class="bg-amber-50 p-6 rounded-3xl">
    <div id="restingPlayers">None</div>
  </div>

  <!-- Matches -->
  <div id="matchesContainer"></div>

</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null;
let players = [];
let matches = [];
let currentRound = 1;

function loadTournament() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("meet")) meetId = params.get("meet");

  if (!meetId) return;

  db.ref("tournaments/" + meetId).on("value", (snap) => {
    const data = snap.val() || {};
    players = data.players || [];
    matches = data.matches || [];
    currentRound = data.currentRound || 1;

    document.getElementById("shareLink").value = window.location.href;
    document.getElementById("roundCounter").textContent = `Round ${currentRound}`;

    renderPlayers();
    renderMatches();
    renderResting();
  });
}

function createTournament() {
  const name = document.getElementById("tournamentName").value;
  meetId = name.replace(/\s+/g, '-').toLowerCase();

  const url = window.location.origin + "?meet=" + meetId;
  window.history.pushState({}, "", url);

  db.ref("tournaments/" + meetId).set({
    players, matches, currentRound, timestamp: Date.now()
  });
}

function addPlayer() {
  let name = document.getElementById("playerInput").value.toLowerCase();
  if (!name || players.includes(name)) return;
  players.push(name);
  saveData();
  document.getElementById("playerInput").value = "";
}

function saveData() {
  if (!meetId) return;
  db.ref("tournaments/" + meetId).update({
    players, matches, currentRound, timestamp: Date.now()
  });
}

function generateMatches() {
  if (players.length < 4) return alert("Need 4 players");

  currentRound++;
  let shuffled = [...players].sort(() => 0.5 - Math.random());

  matches = [];
  for (let i = 0; i < shuffled.length; i += 4) {
    if (i + 3 >= shuffled.length) break;
    matches.push({
      teamA: [shuffled[i], shuffled[i+1]],
      teamB: [shuffled[i+2], shuffled[i+3]],
      scoreA: "", scoreB: ""
    });
  }

  saveData();
  renderMatches();
  renderResting();
}

function renderMatches() {
  const container = document.getElementById("matchesContainer");
  container.innerHTML = "";

  matches.forEach((m, i) => {
    const div = document.createElement("div");
    div.className = "match-card";
    div.innerHTML = `
      <div class="team-block">
        ${capitalize(m.teamA[0])}<br>${capitalize(m.teamA[1])}
      </div>

      <div>
        <input type="number" class="score-input" value="${m.scoreA || ''}" 
        oninput="updateScore(${i}, 'A', this.value)">

        VS

        <input type="number" class="score-input" value="${m.scoreB || ''}" 
        oninput="updateScore(${i}, 'B', this.value)">
      </div>

      <div class="team-block">
        ${capitalize(m.teamB[0])}<br>${capitalize(m.teamB[1])}
      </div>
    `;
    container.appendChild(div);
  });
}

function updateScore(i, side, val) {
  matches[i]["score" + side] = val;
  saveData();
}

function renderPlayers() {
  document.getElementById("playerCount").textContent = players.length;
  document.getElementById("playersList").innerHTML =
    players.map(p => `<div>${capitalize(p)}</div>`).join("");
}

function renderResting() {
  const courts = parseInt(document.getElementById("courtsInput").value) || 1;
  const max = courts * 4;
  const resting = players.slice(max);

  document.getElementById("restingPlayers").innerHTML =
    resting.length ? resting.map(capitalize).join(" • ") : "None";
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href);
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

loadTournament();
</script>

</body>
</html>
