<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PadelPilot Arena | Pro v3.7</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3359/3359245.png">

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05); }
    .match-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0; transition: all 0.3s; }
    .match-active { border-color: #3b82f6; background: #eff6ff; ring: 4px ring-blue-50; }
    .nav-tab { flex: 1; text-align: center; padding: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; border-radius: 14px; color: #94a3b8; transition: 0.2s; }
    .nav-tab.active { background: white; color: #3b82f6; box-shadow: 0 4px 12px -2px rgb(59 130 246 / 0.15); }
    .status-pill { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; }
    .ready-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; }
    .away-badge { background: #f1f5f9; color: #94a3b8; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; }
    .locked-btn { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
  </style>
</head>
<body>

<div class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur-md px-5 py-4 border-b border-slate-100">
  <div class="max-w-xl mx-auto flex bg-slate-200/50 p-1 rounded-2xl">
    <button onclick="switchTab('arena')" id="tab-arena" class="nav-tab active">Arena Hub</button>
    <button onclick="switchTab('stats')" id="tab-stats" class="nav-tab">Standings</button>
    <button onclick="switchTab('monthly')" id="tab-monthly" class="nav-tab">Monthly Board</button>
  </div>
</div>

<div class="max-w-xl mx-auto px-5 py-6 space-y-8">
  <div class="text-center">
    <div class="text-4xl font-black tracking-tighter text-slate-900 uppercase">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <div id="devIndicator" class="hidden text-red-500 text-[10px] font-black uppercase mt-2 bg-red-50 px-3 py-1 rounded-full border border-red-100 inline-block tracking-widest text-center">Admin Access</div>
  </div>

  <div id="view-arena" class="space-y-8">
    <div id="infoDisplay" class="hidden glass-card border-blue-50 bg-blue-50/30 text-center py-4">
        <div id="tourneyTitle" class="text-sm font-black text-slate-800 uppercase mb-3">---</div>
        <div class="flex justify-around items-center px-2">
            <div class="flex-1 text-center">
                <div class="text-[9px] font-bold text-slate-400 uppercase mb-1">Location</div>
                <div id="locContainer" class="font-bold text-slate-700 text-xs">---</div>
            </div>
            <div class="h-8 w-[1px] bg-blue-100 mx-2"></div>
            <div class="flex-1 text-center">
                <div class="text-[9px] font-bold text-slate-400 uppercase mb-1">Date & Time</div>
                <div id="dateTimeText" class="font-bold text-slate-700 text-xs">---</div>
            </div>
        </div>
    </div>

    <section id="setupArea" class="glass-card space-y-4">
      <div class="text-xs font-black uppercase text-slate-400 mb-2">Tournament Setup</div>
      <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none font-bold" placeholder="Tournament Name">
      <input id="tournamentLocation" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm" placeholder="Location Name">
      <input id="tournamentMap" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-[10px]" placeholder="Google Maps Link (Optional)">
      <div class="grid grid-cols-2 gap-4">
        <input id="tournamentDate" type="date" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm">
        <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm">
      </div>
      <button onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase shadow-lg">Initialize Arena</button>
    </section>

    <div class="space-y-3">
      <div class="flex gap-2">
        <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg outline-none focus:ring-2 ring-blue-100" placeholder="Enter Name">
        <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold shadow-lg shadow-blue-100 uppercase text-xs">Join</button>
      </div>
      <div id="shareSection" class="hidden glass-card flex gap-2 items-center !p-4">
        <input id="shareLink" class="flex-1 p-3 border rounded-xl text-[10px] bg-slate-50 text-slate-400 truncate" readonly />
        <button onclick="copyLink()" class="bg-blue-600 text-white px-5 py-3 rounded-xl text-xs font-bold uppercase">Copy</button>

    </div>

    <div class="space-y-4">
        <div class="glass-card space-y-4 text-center border-orange-100">
          <div class="flex justify-between items-center px-2">
            <label class="font-bold text-slate-700">Courts</label>
            <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold text-orange-600 bg-orange-50">
          </div>
          <button id="rotateBtn" onclick="smartRotate()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-md uppercase">Generate Random Rotation</button>
          <div id="lockNotice" class="hidden text-[9px] font-black text-orange-400 uppercase tracking-widest text-center">Locked until start time</div>
        </div>

        <div class="glass-card border-purple-100 bg-purple-50/20">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-[10px] font-black uppercase text-purple-500 tracking-widest">Manual Match Builder</h3>
                <button onclick="toggleManualMode()" id="manualToggleBtn" class="text-[9px] font-bold bg-white border px-3 py-1 rounded-lg shadow-sm">Open Builder</button>
            </div>
            <div id="manualBuilder" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <select id="p1" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                        <select id="p2" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                    </div>
                    <div class="space-y-2">
                        <select id="p3" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                        <select id="p4" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                    </div>
                </div>
                <button onclick="createManualMatch()" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-purple-100">Pitch Matchup</button>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 gap-4">
      <div class="glass-card">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4 text-center">Ready Players (<span id="benchCount">0</span>)</div>
        <div id="benchList" class="grid grid-cols-2 gap-2"></div>
      </div>
      <div class="glass-card">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">All Registered (<span id="totalRegCount">0</span>)</div>
        <div id="playersList" class="space-y-2 max-h-96 overflow-y-auto pr-1"></div>
      </div>
    </div>

    <div id="allRoundsContainer" class="space-y-6 pb-20"></div>
  </div>

  <div id="view-stats" class="hidden">
    <div class="bg-white border rounded-[32px] overflow-hidden shadow-sm">
      <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
        <h2 class="font-black uppercase tracking-tighter text-xl">Standings</h2>
        <span class="text-[10px] bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-bold uppercase">3 Win / 1 Draw</span>
      </div>
      <table class="w-full">
        <thead>
          <tr class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/50 border-b">
            <th class="px-4 py-3 text-center">Rank</th>
            <th class="px-4 py-3 text-left">Player</th>
            <th class="px-4 py-3 text-center">W/D/L</th>
            <th class="px-4 py-3 text-center">+/-</th>
            <th class="px-4 py-3 text-right">Pts</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <div id="view-monthly" class="hidden space-y-4">
    <div class="bg-white border rounded-[32px] overflow-hidden shadow-sm">
      <div class="p-6 bg-slate-50 border-b flex flex-col sm:flex-row gap-4 justify-between sm:items-center">
        <div>
            <h2 class="font-black uppercase tracking-tighter text-xl">Monthly Board</h2>
            <div id="currentMonthLabel" class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Loading Stats...</div>
        </div>
        <div class="flex gap-2">
            <button onclick="shareToWhatsApp()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider shadow-sm flex items-center gap-1.5 transition">
                💬 WhatsApp
            </button>
            <button onclick="exportToCSV()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-xl text-[10px] font-black uppercase tracking-wider shadow-sm flex items-center gap-1.5 transition">
                📊 Spreadsheet
            </button>
        </div>
      </div>
      <table class="w-full">
        <thead>
          <tr class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/50 border-b">
            <th class="px-4 py-3 text-center">Rank</th>
            <th class="px-4 py-3 text-left">Player</th>
            <th class="px-4 py-3 text-center">W/D/L</th>
            <th class="px-4 py-3 text-center">+/-</th>
            <th class="px-4 py-3 text-right">Pts</th>
          </tr>
        </thead>
        <tbody id="monthlyLeaderboardBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <div class="text-center py-10 opacity-30">
    <button onclick="unlockDev()" class="text-[10px] font-bold uppercase tracking-[0.4em]">Developer Access</button>
    <div id="adminResetContainer" class="hidden mt-4 flex justify-center gap-2">
        <button onclick="weeklyResetOnly()" class="text-[10px] text-orange-600 font-bold border border-orange-100 px-4 py-2 rounded-full bg-orange-50/50">Reset Weekly Games</button>
        <button onclick="masterReset()" class="text-[10px] text-red-500 font-bold border border-red-100 px-4 py-2 rounded-full">Reset All Data</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null, players = [], allRounds = [], historicalMatches = [], registeredIPs = [], isAdmin = false, userIP = "", startTime = "", startDate = "", manualModeActive = false;
let computedMonthlyRanking = [];

fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => { userIP = d.ip; loadArena(); }).catch(() => loadArena());

function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    document.getElementById("setupArea").classList.add("hidden");
    document.getElementById("shareSection").classList.remove("hidden");
    document.getElementById("shareLink").value = window.location.href;
    db.ref("tournaments/" + meetId).on("value", snap => {
      const d = snap.val() || {};
      players = d.players || []; allRounds = d.rounds || []; registeredIPs = d.registeredIPs || [];
      historicalMatches = d.historicalMatches || [];
      startTime = d.time || ""; startDate = d.date || "";
      if(d.name) {
          document.getElementById("infoDisplay").classList.remove("hidden");
          document.getElementById("tourneyTitle").innerText = d.name;
          const lc = document.getElementById("locContainer");
          lc.innerHTML = d.mapLink ? `<a href="${d.mapLink}" target="_blank" class="text-blue-600 underline">📍 ${d.location || 'Location'}</a>` : (d.location || "---");
          document.getElementById("dateTimeText").innerText = `${d.date || ''} @ ${d.time || ''}`;
      }
      checkTimeLock(); renderAll();
    });
  }
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer"); container.innerHTML = "";
  if (allRounds.length === 0) { container.innerHTML = `<div class="text-center py-10 text-slate-300 font-bold text-xs uppercase">No matches generated</div>`; return; }

  allRounds.slice().reverse().forEach((round, riInv) => {
    const ri = allRounds.length - 1 - riInv;
    container.innerHTML += `<div class="flex justify-between items-center mt-6 mb-2">
        <div class="text-[10px] font-black text-slate-400 uppercase">Round ${ri + 1}</div>
        ${isAdmin ? `<button onclick="deleteRound(${ri})" class="text-[9px] font-bold text-red-400 uppercase">Delete Round</button>` : ''}
    </div>`;
    round.forEach((m, mi) => {
      const isP = m.status === "playing", isF = m.status === "finished", canEdit = isAdmin || isP;
      container.innerHTML += `<div class="match-card ${isP ? 'match-active' : ''} space-y-4 mb-3">
        <div class="flex justify-between items-center">
            <span class="status-pill ${isF ? 'bg-slate-100 text-slate-400' : isP ? 'bg-blue-600 text-white' : 'bg-orange-100 text-orange-600'}">${m.status}</span>
            <div class="flex gap-3">
                ${!isF ? `<button onclick="toggleMatch(${ri},${mi})" class="text-[10px] font-black uppercase text-blue-500">${isP ? '' : 'START'}</button>` : ''}
                ${isAdmin ? `<button onclick="deleteMatch(${ri},${mi})" class="text-[10px] font-black text-red-500">×</button>` : ''}
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="flex-1 text-center"><div class="text-[9px] font-black uppercase text-slate-400 truncate mb-1">${m.tA[0]} & ${m.tA[1]}</div>
            <input type="number" id="sA-${ri}-${mi}" value="${m.sA !== undefined ? m.sA : ''}" ${!canEdit ? 'readonly' : ''} class="w-full p-3 border rounded-xl text-center font-bold ${isAdmin ? 'bg-white border-blue-200' : 'bg-slate-50'}"></div>
            <div class="text-slate-300 font-black text-xs">VS</div>
            <div class="flex-1 text-center"><div class="text-[9px] font-black uppercase text-slate-400 truncate mb-1">${m.tB[0]} & ${m.tB[1]}</div>
            <input type="number" id="sB-${ri}-${mi}" value="${m.sB !== undefined ? m.sB : ''}" ${!canEdit ? 'readonly' : ''} class="w-full p-3 border rounded-xl text-center font-bold ${isAdmin ? 'bg-white border-blue-200' : 'bg-slate-50'}"></div>
        </div>
        ${canEdit ? `<button onclick="submitScore(${ri},${mi})" class="w-full ${isF ? 'bg-slate-800' : 'bg-blue-600'} text-white py-3 rounded-xl font-bold text-[10px] uppercase">${isF ? 'Update Score' : 'Submit Score'}</button>` : ''}
      </div>`;
    });
  });
}

function submitScore(ri, mi) {
    const sA = document.getElementById(`sA-${ri}-${mi}`).value, sB = document.getElementById(`sB-${ri}-${mi}`).value;
    if(sA === "" || sB === "") return alert("Enter scores!");
    const oldStatus = allRounds[ri][mi].status;
    allRounds[ri][mi].sA = parseInt(sA); allRounds[ri][mi].sB = parseInt(sB); allRounds[ri][mi].status = "finished";
    
    // Inject structural timestamp signature for historical logging extraction queries
    if(!allRounds[ri][mi].timestamp) {
        allRounds[ri][mi].timestamp = Date.now();
    }

    if(oldStatus !== "finished") { [...allRounds[ri][mi].tA, ...allRounds[ri][mi].tB].forEach(n => { const p = players.find(x => x.name === n); if(p) p.gamesPlayed = (p.gamesPlayed || 0) + 1; }); }
    saveData();
}

function renderLeaderboard() {
  let s = {}; players.forEach(p => { s[p.name] = { w:0, d:0, l:0, pts:0, pf:0, pa:0, t:0 }; });
  allRounds.forEach(r => r.forEach(m => { if (m.status === "finished") {
      const a = parseInt(m.sA) || 0, b = parseInt(m.sB) || 0;
      m.tA.forEach(p => { if(s[p]){ s[p].t++; s[p].pf+=a; s[p].pa+=b; if(a>b){s[p].pts+=3; s[p].w++;} else if(a===b){s[p].pts+=1; s[p].d++;} else s[p].l++; }});
      m.tB.forEach(p => { if(s[p]){ s[p].t++; s[p].pf+=b; s[p].pa+=a; if(b>a){s[p].pts+=3; s[p].w++;} else if(a===b){s[p].pts+=1; s[p].d++;} else s[p].l++; }});
  }}));
  let sorted = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts || (b[1].pf-b[1].pa) - (a[1].pf-a[1].pa));
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n, d], i) => {
    let rk = i + 1; if(i===0) rk="🥇"; else if(i===1) rk="🥈"; else if(i===2) rk="🥉";
    const diff = d.pf-d.pa;
    return `<tr class="${i<3?'bg-blue-50/30':''}">
        <td class="px-4 py-5 text-center font-black text-sm">${rk}</td>
        <td class="px-4 py-5"><div class="font-bold uppercase text-xs">${n}</div><div class="text-[8px] text-slate-400 font-bold">${d.t} GP</div></td>
        <td class="px-4 py-5 text-center text-[10px] font-bold text-slate-600">${d.w}-${d.d}-${d.l}</td>
        <td class="px-4 py-5 text-center text-[10px] font-black ${diff>=0?'text-green-500':'text-red-400'}">${diff>0?'+':''}${diff}</td>
        <td class="px-4 py-5 text-right font-black text-blue-600 text-sm">${d.pts}</td>
    </tr>`;
  }).join("");
}

// Monthly Log Computation Engine Engine
function renderMonthlyLeaderboard() {
  const currentMonthName = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById("currentMonthLabel").innerText = `Cumulative Standings • ${currentMonthName}`;
  
  let s = {}; 
  players.forEach(p => { s[p.name] = { w:0, d:0, l:0, pts:0, pf:0, pa:0, t:0 }; });

  // Compile matching metrics using the historical immutable logs
  historicalMatches.forEach(m => {
      const a = parseInt(m.sA) || 0, b = parseInt(m.sB) || 0;
      m.tA.forEach(p => { if(!s[p]) s[p] = { w:0, d:0, l:0, pts:0, pf:0, pa:0, t:0 }; s[p].t++; s[p].pf+=a; s[p].pa+=b; if(a>b){s[p].pts+=3; s[p].w++;} else if(a===b){s[p].pts+=1; s[p].d++;} else s[p].l++; });
      m.tB.forEach(p => { if(!s[p]) s[p] = { w:0, d:0, l:0, pts:0, pf:0, pa:0, t:0 }; s[p].t++; s[p].pf+=b; s[p].pa+=a; if(b>a){s[p].pts+=3; s[p].w++;} else if(a===b){s[p].pts+=1; s[p].d++;} else s[p].l++; });
  });

  computedMonthlyRanking = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts || (b[1].pf-b[1].pa) - (a[1].pf-a[1].pa));
  
  document.getElementById("monthlyLeaderboardBody").innerHTML = computedMonthlyRanking.map(([n, d], i) => {
    let rk = i + 1; if(i===0) rk="🥇"; else if(i===1) rk="🥈"; else if(i===2) rk="🥉";
    const diff = d.pf-d.pa;
    return `<tr class="${i<3?'bg-emerald-50/30':''}">
        <td class="px-4 py-5 text-center font-black text-sm">${rk}</td>
        <td class="px-4 py-5"><div class="font-bold uppercase text-xs">${n}</div><div class="text-[8px] text-slate-400 font-bold">${d.t} GP</div></td>
        <td class="px-4 py-5 text-center text-[10px] font-bold text-slate-600">${d.w}-${d.d}-${d.l}</td>
        <td class="px-4 py-5 text-center text-[10px] font-black ${diff>=0?'text-green-500':'text-red-400'}">${diff>0?'+':''}${diff}</td>
        <td class="px-4 py-5 text-right font-black text-emerald-600 text-sm">${d.pts}</td>
    </tr>`;
  }).join("");
}

function shareToWhatsApp() {
  if (computedMonthlyRanking.length === 0) return alert("No monthly data to share yet!");
  const monthStr = new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
  
  let text = `🏆 *PADELPILOT ARENA - ${monthStr}* 🏆\n\n`;
  computedMonthlyRanking.forEach(([name, d], i) => {
      let medal = `${i + 1}.`;
      if(i === 0) medal = "🥇";
      else if(i === 1) medal = "🥈";
      else if(i === 2) medal = "🥉";
      const diff = d.pf - d.pa;
      text += `${medal} *${name.toUpperCase()}* — ${d.pts} pts (${d.w}W-${d.d}D-${d.l}L | ${diff >= 0 ? '+' : ''}${diff})\n`;
  });
  text += `\n🎾 _Keep grinding! The monthly ladder updates on every reset._`;
  
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function exportToCSV() {
  if (computedMonthlyRanking.length === 0) return alert("No stats data available to export!");
  const currentMonthName = new Date().toLocaleString('en-US', { month: 'short', year: 'numeric' }).replace(' ', '_');
  
  let csvContent = "data:text/csv;charset=utf-8,Rank,Player,Games Played,Wins,Draws,Losses,Plus Minus,Points\n";
  computedMonthlyRanking.forEach(([name, d], i) => {
      csvContent += `${i + 1},${name.toUpperCase()},${d.t},${d.w},${d.d},${d.l},${d.pf - d.pa},${d.pts}\n`;
  });
  
  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", `padelpilot_leaderboard_${currentMonthName.toLowerCase()}.csv`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function addPlayer() {
  const n = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!n) return; if(players.some(p => p.name === n)) return alert("Taken!");
  if(!isAdmin && registeredIPs && registeredIPs.includes(userIP)) return alert("One player per device!");
  players.push({ name: n, checkedIn: false, gamesPlayed: 0 });
  if(!isAdmin) { if(!registeredIPs) registeredIPs = []; registeredIPs.push(userIP); }
  saveData(); document.getElementById("playerInput").value = "";
}

function deleteMatch(ri, mi) { if(isAdmin && confirm("Delete match?")) { allRounds[ri].splice(mi,1); if(allRounds[ri].length===0) allRounds.splice(ri,1); saveData(); } }
function deleteRound(ri) { if(isAdmin && confirm("Delete Round?")) { allRounds.splice(ri,1); saveData(); } }
function smartRotate() {
  const c = parseInt(document.getElementById("courtsInput").value); let busy = [];
  allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); }));
  let av = players.filter(p => p.checkedIn && !busy.includes(p.name)).sort((a,b) => (a.gamesPlayed||0)-(b.gamesPlayed||0));
  if (av.length < 4) return alert("Need 4 ready players!");
  let nm = []; for(let i=0; i<c && av.length>=4; i++) { av.sort(()=>Math.random()-0.5); nm.push({ tA:[av.shift().name, av.shift().name], tB:[av.shift().name, av.shift().name], sA:"", sB:"", status:"waiting" }); }
  if(nm.length>0) { allRounds.push(nm); saveData(); }
}

function createManualMatch() {
    const p = [document.getElementById("p1").value, document.getElementById("p2").value, document.getElementById("p3").value, document.getElementById("p4").value];
    if (new Set(p.filter(x=>x)).size < 4) return alert("Select 4 players!");
    const m = { tA:[p[0],p[1]], tB:[p[2],p[3]], sA:"", sB:"", status:"waiting" };
    if (allRounds.length===0) allRounds.push([m]); else allRounds[allRounds.length-1].push(m);
    saveData(); toggleManualMode();
}

function toggleManualMode() { manualModeActive = !manualModeActive; document.getElementById("manualBuilder").classList.toggle("hidden", !manualModeActive); if(manualModeActive) updateManualDropdowns(); }
function updateManualDropdowns() {
    let busy = []; allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); }));
    const av = players.filter(p => p.checkedIn && !busy.includes(p.name));
    ['p1','p2','p3','p4'].forEach(id => { document.getElementById(id).innerHTML = `<option value="">Player</option>` + av.map(p => `<option value="${p.name}">${p.name.toUpperCase()}</option>`).join(""); });
}

function createTournament() {
  const n = document.getElementById("tournamentName").value.trim(); if(!n) return alert("Name it!");
  meetId = n.replace(/\s+/g,'-').toLowerCase();
  db.ref("tournaments/"+meetId).update({ name: n, location: document.getElementById("tournamentLocation").value, mapLink: document.getElementById("tournamentMap").value, date: document.getElementById("tournamentDate").value, time: document.getElementById("tournamentTime").value, createdAt: Date.now() })
    .then(() => { window.location.search = "?meet=" + meetId; });
}

function renderPlayers() { document.getElementById("totalRegCount").innerText = players.length; document.getElementById("playersList").innerHTML = players.map((p, i) => `<div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 mb-1"><div class="flex items-center gap-3"><span class="text-xs font-bold uppercase">${p.name}</span>${p.checkedIn ? '<span class="ready-badge">READY</span>' : '<span class="away-badge">AWAY</span>'}</div><button onclick="toggleCheckIn(${i})" class="text-[9px] font-black px-2 py-1 bg-white border rounded shadow-sm">${p.checkedIn?'AWAY':'READY'}</button></div>`).join(""); }
function renderBench() { let busy = []; allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); })); const res = players.filter(p => p.checkedIn && !busy.includes(p.name)); document.getElementById("benchCount").innerText = res.length; document.getElementById("benchList").innerHTML = res.map(p => `<div class="bg-blue-50 border border-blue-100 p-3 rounded-2xl text-center text-[10px] font-black uppercase text-blue-600">${p.name}</div>`).join(""); }
function toggleCheckIn(i) { players[i].checkedIn = !players[i].checkedIn; saveData(); }
function toggleMatch(ri, mi) { allRounds[ri][mi].status = "playing"; saveData(); }

function switchTab(t) { 
  document.getElementById('view-arena').classList.toggle('hidden', t !== 'arena'); 
  document.getElementById('view-stats').classList.toggle('hidden', t !== 'stats'); 
  document.getElementById('view-monthly').classList.toggle('hidden', t !== 'monthly'); 
  document.getElementById('tab-arena').classList.toggle('active', t === 'arena'); 
  document.getElementById('tab-stats').classList.toggle('active', t === 'stats'); 
  document.getElementById('tab-monthly').classList.toggle('active', t === 'monthly'); 
}

function renderAll() { renderPlayers(); renderBench(); renderAllRounds(); renderLeaderboard(); renderMonthlyLeaderboard(); }
function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds, registeredIPs, historicalMatches }); }
function checkTimeLock() { if (isAdmin || !startTime || !startDate) return; const now = new Date(); const [y, mon, d] = startDate.split('-'); const [h, m] = startTime.split(':'); const tg = new Date(y, mon - 1, d, h, m); const isL = now < tg; const b = document.getElementById("rotateBtn"); b.disabled = isL; b.classList.toggle("locked-btn", isL); document.getElementById("lockNotice").classList.toggle("hidden", !isL); }
function unlockDev() { if(prompt("Dev Pass:") === "padel-dev-123") { isAdmin = true; document.getElementById("devIndicator").classList.remove("hidden"); document.getElementById("adminResetContainer").classList.remove("hidden"); renderAll(); } }

// Strategic Reset Modification: Commits weekly games into historical log before purging active layout
function weeklyResetOnly() {
    if(!isAdmin) return alert("Admin authorization required!");
    if(confirm("Commit active games to the persistent Monthly Board and clear the active rounds display?")) {
        // Collect completed matches from current active sets
        let matchesToCommit = [];
        allRounds.forEach(r => r.forEach(m => {
            if(m.status === "finished") {
                matchesToCommit.push(m);
            }
        }));
        
        // Merge into long-term history array securely
        historicalMatches = [...historicalMatches, ...matchesToCommit];
        
        // Purge active rounds board and reset player court match load counters
        allRounds = [];
        players.forEach(p => { p.gamesPlayed = 0; p.checkedIn = false; });
        
        saveData();
        alert("Weekly arena wiped cleanly. All points logged to Monthly Board safely!");
    }
}

function masterReset() { if(confirm("Wipe all data? This destroys the live session and historical records permanently!")) db.ref("tournaments/" + meetId).set(null).then(() => location.search = ""); }
function copyLink() { navigator.clipboard.writeText(window.location.href); alert("Copied!"); }
</script>
