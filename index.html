<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PadelPilot Arena | Pro v3.0</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3359/3359245.png">

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05); }
    .match-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0; transition: all 0.3s; }
    .match-active { border-color: #3b82f6; background: #eff6ff; ring: 4px ring-blue-50; }
    .nav-tab { flex: 1; text-align: center; padding: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; border-radius: 14px; color: #94a3b8; transition: 0.2s; }
    .nav-tab.active { background: white; color: #3b82f6; box-shadow: 0 4px 12px -2px rgb(59 130 246 / 0.15); }
    .status-pill { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 99px; text-transform: uppercase; }
    .ready-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; }
    .away-badge { background: #f1f5f9; color: #94a3b8; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; }
    .locked-btn { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
    input[type="number"]::-webkit-inner-spin-button { display: none; }
  </style>
</head>
<body>

<div class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur-md px-5 py-4 border-b border-slate-100">
  <div class="max-w-xl mx-auto flex bg-slate-200/50 p-1 rounded-2xl">
    <button onclick="switchTab('arena')" id="tab-arena" class="nav-tab active">Arena Hub</button>
    <button onclick="switchTab('stats')" id="tab-stats" class="nav-tab">Standings</button>
  </div>
</div>

<div class="max-w-xl mx-auto px-5 py-6 space-y-8">
  <div class="text-center">
    <div class="text-4xl font-black tracking-tighter text-slate-900 uppercase">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <div id="devIndicator" class="hidden text-red-500 text-[10px] font-black uppercase mt-2 bg-red-50 px-3 py-1 rounded-full border border-red-100 inline-block tracking-widest">Admin Access</div>
  </div>

  <div id="view-arena" class="space-y-8">
    <div id="infoDisplay" class="hidden glass-card border-blue-50 bg-blue-50/30 text-center py-4">
        <div id="tourneyTitle" class="text-sm font-black text-slate-800 uppercase mb-3">---</div>
        <div class="flex justify-around items-center px-2">
            <div class="flex-1">
                <div class="text-[9px] font-bold text-slate-400 uppercase mb-1">Location</div>
                <div id="locContainer" class="flex items-center justify-center gap-1 font-bold text-slate-700 text-xs">---</div>
            </div>
            <div class="h-8 w-[1px] bg-blue-100 mx-2"></div>
            <div class="flex-1">
                <div class="text-[9px] font-bold text-slate-400 uppercase mb-1">Date & Time</div>
                <div id="dateTimeText" class="font-bold text-slate-700 text-xs">---</div>
            </div>
        </div>
    </div>

    <section id="setupArea" class="glass-card space-y-4">
      <div class="text-xs font-black uppercase text-slate-400 mb-2">Tournament Setup</div>
      <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none font-bold" placeholder="Tournament Name">
      <input id="tournamentLocation" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm" placeholder="Location Name">
      <input id="tournamentMap" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-[10px]" placeholder="Google Maps Link (Optional)">
      <div class="grid grid-cols-2 gap-4">
        <input id="tournamentDate" type="date" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm">
        <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none text-sm">
      </div>
      <button onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase shadow-lg">Initialize Arena</button>
    </section>

    <div id="manualPanel" class="hidden glass-card border-purple-100 bg-purple-50/20">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-[10px] font-black uppercase text-purple-500 tracking-widest">Manual Match Builder</h3>
            <button onclick="toggleManualMode()" id="manualToggleBtn" class="text-[9px] font-bold bg-white border px-3 py-1 rounded-lg shadow-sm">Show Builder</button>
        </div>
        <div id="manualBuilder" class="hidden space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <div class="text-[9px] font-bold text-center text-slate-400 uppercase">Team A</div>
                    <select id="p1" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                    <select id="p2" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                </div>
                <div class="space-y-2">
                    <div class="text-[9px] font-bold text-center text-slate-400 uppercase">Team B</div>
                    <select id="p3" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                    <select id="p4" class="w-full p-3 rounded-xl border text-xs font-bold bg-white outline-none"></select>
                </div>
            </div>
            <button onclick="createManualMatch()" class="w-full bg-purple-600 text-white py-4 rounded-2xl font-black text-sm uppercase">PITCH MATCHUP</button>
        </div>
    </div>

    <div id="shareSection" class="hidden glass-card flex gap-2 items-center">
      <input id="shareLink" class="flex-1 p-3 border rounded-xl text-[10px] bg-slate-50 text-slate-400 truncate" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-5 py-3 rounded-xl text-xs font-bold uppercase">Copy Link</button>
    </div>

    <div class="space-y-3">
      <div class="flex gap-2">
        <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg outline-none focus:ring-2 ring-blue-100" placeholder="Enter Name">
        <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold shadow-lg shadow-blue-100 uppercase text-xs">Join</button>
      </div>
      <div class="glass-card">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Players (<span id="totalRegCount">0</span>)</div>
        <div id="playersList" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
      </div>
      <div class="glass-card">
        <div class="flex justify-between items-center mb-4 text-xs font-black uppercase">
          <h3 class="text-blue-500">Waiting Bench</h3>
          <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg"><span id="benchCount">0</span> Ready</span>
        </div>
        <div id="benchList" class="grid grid-cols-2 gap-2"></div>
      </div>
    </div>

    <div class="glass-card space-y-4 text-center border-orange-100 shadow-orange-50/50 shadow-lg">
      <div class="flex justify-between items-center px-2">
        <label class="font-bold text-slate-700">Courts</label>
        <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold text-orange-600 bg-orange-50">
      </div>
      <button id="rotateBtn" onclick="smartRotate()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-md uppercase tracking-tight transition active:scale-95">Generate Random Rotation</button>
      <div id="lockNotice" class="hidden text-[9px] font-black text-orange-400 uppercase tracking-widest text-center">Locked until start time</div>
    </div>

    <div id="allRoundsContainer" class="space-y-6 pb-20"></div>
  </div>

  <div id="view-stats" class="hidden">
    <div class="bg-white border rounded-[32px] overflow-hidden shadow-sm">
      <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
        <h2 class="font-black uppercase tracking-tighter text-xl">Standings</h2>
        <span class="text-[10px] bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-bold uppercase">3 Win / 1 Draw</span>
      </div>
      <table class="w-full">
        <thead>
          <tr class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/50 border-b">
            <th class="px-4 py-3 text-center">Rank</th>
            <th class="px-4 py-3 text-left">Player</th>
            <th class="px-4 py-3 text-center">+/- (Pts)</th>
            <th class="px-4 py-3 text-right">Points</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <div class="text-center py-10 opacity-30">
    <button onclick="unlockDev()" class="text-[10px] font-bold uppercase tracking-[0.4em]">Developer Access</button>
    <div id="adminResetContainer" class="hidden mt-4 flex justify-center gap-2">
        <button onclick="masterReset()" class="text-[10px] text-red-500 font-bold border border-red-100 px-4 py-2 rounded-full">Reset Everything</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null, players = [], allRounds = [], registeredIPs = [], isAdmin = false, userIP = "", startTime = "", startDate = "", manualModeActive = false;
fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => userIP = d.ip);

function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    document.getElementById("setupArea").classList.add("hidden");
    document.getElementById("shareSection").classList.remove("hidden");
    document.getElementById("shareLink").value = window.location.href;
    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      players = data.players || [];
      allRounds = data.rounds || [];
      registeredIPs = data.registeredIPs || [];
      startTime = data.time || "";
      startDate = data.date || "";
      
      if(data.name || data.location) {
          document.getElementById("infoDisplay").classList.remove("hidden");
          document.getElementById("tourneyTitle").innerText = data.name || "Tournament";
          
          const locDiv = document.getElementById("locContainer");
          locDiv.innerHTML = data.mapLink ? 
            `<a href="${data.mapLink}" target="_blank" class="text-blue-600 underline">📍 ${data.location}</a>` : data.location || "---";
          
          document.getElementById("dateTimeText").innerText = `${data.date || ''} @ ${data.time || ''}`;
      }
      checkTimeLock(); renderAll();
    });
  }
}

function checkTimeLock() {
    if (isAdmin || !startTime || !startDate) return;
    const now = new Date();
    const [y, mon, d] = startDate.split('-');
    const [h, m] = startTime.split(':');
    const target = new Date(y, mon - 1, d, h, m);
    const isLocked = now < target;
    const btn = document.getElementById("rotateBtn");
    btn.disabled = isLocked;
    btn.classList.toggle("locked-btn", isLocked);
    document.getElementById("lockNotice").classList.toggle("hidden", !isLocked);
}

function createTournament() {
  const n = document.getElementById("tournamentName").value.trim();
  const l = document.getElementById("tournamentLocation").value.trim();
  const m = document.getElementById("tournamentMap").value.trim();
  const d = document.getElementById("tournamentDate").value;
  const t = document.getElementById("tournamentTime").value;
  if(!n) return alert("Enter Tournament Name!");
  meetId = n.replace(/\s+/g,'-').toLowerCase();
  db.ref("tournaments/" + meetId).update({ name: n, location: l, mapLink: m, date: d, time: t, createdAt: Date.now() })
    .then(() => { window.location.search = "?meet=" + meetId; });
}

function submitScore(ri, mi) {
    const sA = document.getElementById(`sA-${ri}-${mi}`).value;
    const sB = document.getElementById(`sB-${ri}-${mi}`).value;
    if(sA === "" || sB === "") return alert("Enter both scores!");
    
    allRounds[ri][mi].sA = parseInt(sA);
    allRounds[ri][mi].sB = parseInt(sB);
    allRounds[ri][mi].status = "finished";
    
    // Update games played count
    [...allRounds[ri][mi].tA, ...allRounds[ri][mi].tB].forEach(name => {
        const p = players.find(x => x.name === name);
        if(p) p.gamesPlayed = (p.gamesPlayed || 0) + 1;
    });
    saveData();
}

function smartRotate() {
  const courts = parseInt(document.getElementById("courtsInput").value);
  let busy = [];
  allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); }));
  let available = players.filter(p => p.checkedIn && !busy.includes(p.name));
  available.sort((a, b) => (a.gamesPlayed || 0) - (b.gamesPlayed || 0));
  if (available.length < 4) return alert("Need 4 ready players!");
  
  let newMatches = [];
  for(let i=0; i < courts && available.length >= 4; i++) {
    available.sort(() => Math.random() - 0.5);
    newMatches.push({ tA: [available.shift().name, available.shift().name], tB: [available.shift().name, available.shift().name], sA: "", sB: "", status: "waiting" });
  }
  if(newMatches.length > 0) { allRounds.push(newMatches); saveData(); }
}

function toggleManualMode() {
    manualModeActive = !manualModeActive;
    document.getElementById("manualBuilder").classList.toggle("hidden", !manualModeActive);
    document.getElementById("manualToggleBtn").innerText = manualModeActive ? "Hide Builder" : "Show Builder";
    if(manualModeActive) updateManualDropdowns();
}

function updateManualDropdowns() {
    let busy = [];
    allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); }));
    const available = players.filter(p => p.checkedIn && !busy.includes(p.name));
    ['p1', 'p2', 'p3', 'p4'].forEach(id => {
        document.getElementById(id).innerHTML = `<option value="">Select Player</option>` + available.map(p => `<option value="${p.name}">${p.name.toUpperCase()}</option>`).join("");
    });
}

function createManualMatch() {
    const p = [document.getElementById("p1").value, document.getElementById("p2").value, document.getElementById("p3").value, document.getElementById("p4").value];
    if (new Set(p.filter(x => x)).size < 4) return alert("Select 4 unique players!");
    const m = { tA: [p[0], p[1]], tB: [p[2], p[3]], sA: "", sB: "", status: "waiting" };
    if (allRounds.length === 0) allRounds.push([m]); else allRounds[allRounds.length-1].push(m);
    saveData(); toggleManualMode();
}

function renderLeaderboard() {
  let s = {};
  players.forEach(p => { s[p.name] = { w: 0, l: 0, d: 0, pts: 0, pf: 0, pa: 0, t: 0 }; });
  allRounds.forEach(r => r.forEach(m => {
    if (m.status === "finished") {
      const a = parseInt(m.sA), b = parseInt(m.sB);
      m.tA.forEach(p => { if(s[p]){ s[p].t++; s[p].pf+=a; s[p].pa+=b; if(a>b){s[p].pts+=3;s[p].w++;}else if(a===b){s[p].pts+=1;s[p].d++;}else s[p].l++; }});
      m.tB.forEach(p => { if(s[p]){ s[p].t++; s[p].pf+=b; s[p].pa+=a; if(b>a){s[p].pts+=3;s[p].w++;}else if(a===b){s[p].pts+=1;s[p].d++;}else s[p].l++; }});
    }
  }));
  let sorted = Object.entries(s).sort((a, b) => b[1].pts - a[1].pts || (b[1].pf - b[1].pa) - (a[1].pf - a[1].pa));
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n, d], i) => `<tr><td class="px-4 py-4 text-center font-black">${i+1}</td><td class="px-4 py-4"><div class="font-bold uppercase text-xs">${n}</div><div class="text-[8px] text-slate-400 font-bold">${d.t} GP</div></td><td class="px-4 py-4 text-center text-xs font-bold ${d.pf-d.pa>=0 ? 'text-green-500':'text-red-400'}">${d.pf-d.pa > 0 ? '+':''}${d.pf-d.pa} (${d.pf})</td><td class="px-4 py-4 text-right font-black text-blue-600">${d.pts}</td></tr>`).join("");
}

function renderAllRounds() {
  const c = document.getElementById("allRoundsContainer"); c.innerHTML = "";
  allRounds.slice().reverse().forEach((r, riInv) => {
    const ri = allRounds.length - 1 - riInv;
    r.forEach((m, mi) => {
      const isP = m.status === "playing", isF = m.status === "finished";
      c.innerHTML += `<div class="match-card ${isP ? 'match-active' : ''} space-y-4">
        <div class="flex justify-between items-center"><span class="status-pill ${isF ? 'bg-slate-100' : isP ? 'bg-blue-600 text-white' : 'bg-orange-100 text-orange-600'}">${m.status}</span>${!isF ? `<button onclick="toggleMatch(${ri},${mi})" class="text-[10px] font-black uppercase text-blue-500">${isP ? '' : 'START'}</button>` : ''}</div>
        <div class="flex items-center gap-3">
            <div class="flex-1 space-y-1"><div class="text-[9px] font-black uppercase text-slate-400 truncate text-center">${m.tA[0]} & ${m.tA[1]}</div><input type="number" id="sA-${ri}-${mi}" value="${m.sA}" ${!isAdmin && !isP ? 'readonly' : ''} class="w-full p-3 border rounded-xl text-center font-bold text-sm bg-slate-50"></div>
            <div class="text-slate-300 font-black">VS</div>
            <div class="flex-1 space-y-1"><div class="text-[9px] font-black uppercase text-slate-400 truncate text-center">${m.tB[0]} & ${m.tB[1]}</div><input type="number" id="sB-${ri}-${mi}" value="${m.sB}" ${!isAdmin && !isP ? 'readonly' : ''} class="w-full p-3 border rounded-xl text-center font-bold text-sm bg-slate-50"></div>
        </div>
        ${(isAdmin || isP) && !isF ? `<button onclick="submitScore(${ri},${mi})" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold text-[10px] uppercase">Submit Americano Score</button>` : ''}
      </div>`;
    });
  });
}

function addPlayer() {
  const n = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!n || players.some(p => p.name === n)) return;
  players.push({ name: n, checkedIn: false, gamesPlayed: 0 });
  saveData(); document.getElementById("playerInput").value = "";
}

function toggleCheckIn(i) { players[i].checkedIn = !players[i].checkedIn; saveData(); }
function toggleMatch(ri, mi) { allRounds[ri][mi].status = "playing"; saveData(); }
function unlockDev() { if(prompt("Dev Pass:") === "padel-dev-123") { isAdmin = true; document.getElementById("devIndicator").classList.remove("hidden"); document.getElementById("adminResetContainer").classList.remove("hidden"); document.getElementById("manualPanel").classList.remove("hidden"); renderAll(); } }
function switchTab(t) { document.getElementById('view-arena').classList.toggle('hidden', t !== 'arena'); document.getElementById('view-stats').classList.toggle('hidden', t !== 'stats'); document.getElementById('tab-arena').classList.toggle('active', t === 'arena'); document.getElementById('tab-stats').classList.toggle('active', t === 'stats'); }
function renderAll() { renderPlayers(); renderBench(); renderAllRounds(); renderLeaderboard(); }
function renderPlayers() { document.getElementById("totalRegCount").innerText = players.length; document.getElementById("playersList").innerHTML = players.map((p, i) => `<div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50"><div class="flex items-center gap-3"><span class="text-sm font-bold uppercase">${p.name}</span>${p.checkedIn ? '<span class="ready-badge">READY</span>' : '<span class="away-badge">AWAY</span>'}</div><button onclick="toggleCheckIn(${i})" class="text-[9px] font-black px-2 py-1 bg-white border rounded shadow-sm">${p.checkedIn ? 'AWAY' : 'READY'}</button></div>`).join(""); }
function renderBench() { let busy = []; allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); })); const resting = players.filter(p => p.checkedIn && !busy.includes(p.name)); document.getElementById("benchCount").innerText = resting.length; document.getElementById("benchList").innerHTML = resting.map(p => `<div class="bg-blue-50 border border-blue-100 p-3 rounded-2xl text-center text-[10px] font-black uppercase text-blue-600">${p.name}</div>`).join(""); }
function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds, registeredIPs }); }
function masterReset() { if(confirm("Wipe?")) { db.ref("tournaments/" + meetId).set(null).then(() => location.search = ""); } }
function copyLink() { navigator.clipboard.writeText(window.location.href); alert("Link Copied!"); }

loadArena();
</script>
</body>
</html>
