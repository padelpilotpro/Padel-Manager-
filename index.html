<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena | Pro Hub</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.03); }
    .match-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0; transition: all 0.3s; }
    .match-active { border-color: #3b82f6; background: #f0f7ff; ring: 4px ring-blue-50; }
    .team-btn { flex: 1; padding: 12px; border-radius: 16px; border: 2px solid #f1f5f9; text-align: center; cursor: pointer; background: white; transition: transform 0.1s; }
    .team-btn:active { transform: scale(0.95); }
    .team-btn.winner { background: #22c55e; border-color: #16a34a; color: white; }
    .nav-tab { flex: 1; text-align: center; padding: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; border-radius: 14px; color: #94a3b8; }
    .nav-tab.active { background: white; color: #3b82f6; box-shadow: 0 4px 12px -2px rgb(59 130 246 / 0.15); }
    .status-pill { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; }
  </style>
</head>
<body>

<div class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur-md px-5 py-4 border-b">
  <div class="max-w-xl mx-auto flex bg-slate-200/50 p-1 rounded-2xl">
    <button onclick="switchTab('arena')" id="tab-arena" class="nav-tab active">Arena Hub</button>
    <button onclick="switchTab('stats')" id="tab-stats" class="nav-tab">Standings</button>
  </div>
</div>

<div class="max-w-xl mx-auto px-5 py-6 space-y-8">
  <div id="view-arena" class="space-y-8">
    
    <section id="setupArea" class="glass-card space-y-4">
      <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none font-bold" placeholder="Tournament Name">
      <button onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Initialize Arena</button>
    </section>

    <div class="glass-card">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-black uppercase text-xs tracking-widest text-slate-400">Registered Players (<span id="totalRegCount">0</span>)</h3>
      </div>
      <div class="flex gap-2 mb-4">
        <input id="playerInput" class="flex-1 p-4 border rounded-xl outline-none focus:border-blue-400" placeholder="New Player Name">
        <button onclick="addPlayer()" class="bg-blue-600 text-white px-6 rounded-xl font-bold">Add</button>
      </div>
      <div id="playersList" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
    </div>

    <div class="glass-card border-slate-100">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-black uppercase text-xs tracking-widest text-blue-500">The Waiting Bench</h3>
        <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg text-[10px] font-bold uppercase"><span id="benchCount">0</span> Resting</span>
      </div>
      <div id="benchList" class="grid grid-cols-2 gap-2">
        </div>
    </div>

    <div class="glass-card space-y-4 border-orange-100 shadow-lg shadow-orange-50">
      <div class="flex justify-between items-center">
        <label class="font-bold text-slate-600">Courts Available</label>
        <input id="courtsInput" type="number" value="1" class="w-16 p-2 border rounded-xl text-center font-bold text-orange-600 bg-orange-50">
      </div>
      <button onclick="smartRotate()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-md uppercase">Generate Next Rotation</button>
    </div>

    <div id="allRoundsContainer" class="space-y-6 pb-20"></div>
  </div>

  <div id="view-stats" class="hidden">
    <div class="bg-white border rounded-[32px] overflow-hidden">
      <div class="p-8 bg-slate-50 border-b font-black uppercase text-center tracking-widest">Tournament Rankings</div>
      <table class="w-full">
        <tbody id="leaderboardBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null, players = [], allRounds = [];

function switchTab(t) {
  document.getElementById('view-arena').classList.toggle('hidden', t!=='arena');
  document.getElementById('view-stats').classList.toggle('hidden', t!=='stats');
  document.getElementById('tab-arena').classList.toggle('active', t==='arena');
  document.getElementById('tab-stats').classList.toggle('active', t==='stats');
}

function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    document.getElementById("setupArea").classList.add("hidden");
    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      players = data.players || [];
      allRounds = data.rounds || [];
      renderAll();
    });
  }
}

function renderAll() {
    renderPlayers();
    renderBench();
    renderAllRounds();
    renderLeaderboard();
}

function addPlayer() {
  const name = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!name || players.some(p => p.name === name)) return;
  players.push({ name, checkedIn: true, gamesPlayed: 0 });
  saveData();
  document.getElementById("playerInput").value = "";
}

function toggleMatch(ri, mi) {
    const match = allRounds[ri][mi];
    if (match.status === "waiting") match.status = "playing";
    saveData();
}

function selectWinner(ri, mi, team) {
  const match = allRounds[ri][mi];
  match.sA = (team === 'A') ? "1" : "0";
  match.sB = (team === 'B') ? "1" : "0";
  match.status = "finished";
  
  [...match.tA, ...match.tB].forEach(pName => {
      const p = players.find(x => x.name === pName);
      if(p) p.gamesPlayed = (p.gamesPlayed || 0) + 1;
  });
  saveData();
}

function smartRotate() {
  const activePlayers = players.map(p => p.name);
  const courts = parseInt(document.getElementById("courtsInput").value);
  
  let updatedRounds = allRounds.filter(r => r.some(m => m.status === "finished" || m.status === "playing"));
  let busyPlayers = [];
  updatedRounds.forEach(r => r.forEach(m => {
      if(m.status === "playing") busyPlayers.push(...m.tA, ...m.tB);
  }));

  let available = activePlayers.filter(p => !busyPlayers.includes(p));
  available.sort((a,b) => {
      const pA = players.find(x => x.name === a);
      const pB = players.find(x => x.name === b);
      return (pA.gamesPlayed || 0) - (pB.gamesPlayed || 0);
  });

  if (available.length < 4) return alert("Not enough free players!");

  let newMatches = [];
  for(let i=0; i < courts; i++) {
      if(available.length >= 4) {
          newMatches.push({
              tA: [available.shift(), available.shift()],
              tB: [available.shift(), available.shift()],
              sA: "", sB: "", status: "waiting"
          });
      }
  }
  
  if(newMatches.length > 0) updatedRounds.push(newMatches);
  allRounds = updatedRounds;
  saveData();
}

function renderPlayers() {
  document.getElementById("totalRegCount").innerText = players.length;
  document.getElementById("playersList").innerHTML = players.map((p, i) => `
    <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 border-slate-100">
      <span class="text-sm font-bold uppercase text-slate-700">${p.name} <small class="text-slate-400 font-normal ml-2">${p.gamesPlayed || 0} Games</small></span>
      <button onclick="removePlayer(${i})" class="text-red-300 hover:text-red-500 text-xs font-bold px-2">Remove</button>
    </div>`).join("");
}

function renderBench() {
    let busyPlayers = [];
    allRounds.forEach(r => r.forEach(m => {
        if(m.status === "playing") busyPlayers.push(...m.tA, ...m.tB);
    }));

    const resting = players.filter(p => !busyPlayers.includes(p));
    document.getElementById("benchCount").innerText = resting.length;
    
    document.getElementById("benchList").innerHTML = resting.length > 0 
        ? resting.map(p => `
            <div class="bg-blue-50/50 border border-blue-100 p-3 rounded-2xl text-center">
                <div class="text-[10px] font-black uppercase text-blue-600 truncate">${p.name}</div>
                <div class="text-[8px] font-bold text-blue-300 uppercase">Available</div>
            </div>`).join("")
        : `<div class="col-span-2 text-center text-[10px] py-4 text-slate-300 uppercase font-bold tracking-widest">Everyone is playing</div>`;
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer"); container.innerHTML = "";
  allRounds.slice().reverse().forEach((r, riInv) => {
    const ri = allRounds.length - 1 - riInv;
    r.forEach((m, mi) => {
      const isPlaying = m.status === "playing";
      const isFinished = m.status === "finished";
      
      container.innerHTML += `
        <div class="match-card ${isPlaying ? 'match-active shadow-lg shadow-blue-100/50' : ''} space-y-4">
          <div class="flex justify-between items-center">
            <span class="status-pill ${isFinished ? 'bg-slate-100 text-slate-400' : isPlaying ? 'bg-blue-600 text-white' : 'bg-orange-100 text-orange-600'}">
                ${m.status}
            </span>
            ${!isFinished ? `<button onclick="toggleMatch(${ri},${mi})" class="text-[10px] font-black uppercase text-blue-500 tracking-tighter">${isPlaying ? '' : 'START MATCH →'}</button>` : ''}
          </div>
          <div class="flex gap-2 items-center">
            <button onclick="${isPlaying ? `selectWinner(${ri},${mi},'A')` : ''}" class="team-btn ${m.sA === '1' ? 'winner shadow-lg shadow-green-200' : ''}">
                <div class="text-[11px] font-bold uppercase truncate">${m.tA[0]} & ${m.tA[1]}</div>
            </button>
            <div class="text-[9px] font-black text-slate-200">VS</div>
            <button onclick="${isPlaying ? `selectWinner(${ri},${mi},'B')` : ''}" class="team-btn ${m.sB === '1' ? 'winner shadow-lg shadow-green-200' : ''}">
                <div class="text-[11px] font-bold uppercase truncate">${m.tB[0]} & ${m.tB[1]}</div>
            </button>
          </div>
        </div>`;
    });
  });
}

function renderLeaderboard() {
  let s = {}; players.forEach(p => s[p.name] = { w: 0, pts: 0 });
  allRounds.forEach(r => r.forEach(m => {
    if(m.sA === "1") { m.tA.forEach(p=>{if(s[p]){s[p].pts+=3; s[p].w++}}); }
    if(m.sB === "1") { m.tB.forEach(p=>{if(s[p]){s[p].pts+=3; s[p].w++}}); }
  }));
  let sorted = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts);
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n,v], i) => `
    <tr class="text-sm border-b border-slate-50">
        <td class="p-6 font-black text-slate-300 w-12 text-center">#${i+1}</td>
        <td class="font-bold uppercase text-slate-700">${n}</td>
        <td class="text-right p-6 font-black text-blue-600 text-lg">${v.pts} <span class="text-[10px] text-slate-300 ml-1">PTS</span></td>
    </tr>`).join("");
}

function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if(!name) return;
  meetId = name.replace(/\s+/g,'-').toLowerCase();
  db.ref("tournaments/" + meetId).update({ name, createdAt: Date.now() }).then(() => {
    location.search = "?meet=" + meetId;
  });
}

function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds }); }
function removePlayer(i) { if(confirm("Remove player?")) { players.splice(i,1); saveData(); } }

loadArena();
</script>
</body>
</html>
