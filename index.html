<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background: #f8fafc; font-family: Inter, system-ui, sans-serif; color: #0f172a; }
    .match-card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px -2px rgb(0 0 0 / 0.1);
    }
    .team-block {
      width: 38%;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }
    .score-input {
      width: 75px;
      height: 55px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="max-w-4xl mx-auto px-5 py-8 space-y-10">

  <div class="text-center py-6 space-y-1">
    <div class="text-4xl font-black tracking-widest text-gray-900">PADELPILOT</div>
    <div class="text-blue-600 text-3xl font-bold">Arena</div>
  </div>

  <!-- Tournament Setup -->
  <div class="bg-white border rounded-3xl p-8 shadow-sm space-y-6">
    <div>
      <label class="text-sm font-semibold text-gray-600 block mb-2">Tournament Name</label>
      <input id="tournamentName" class="w-full p-5 border rounded-2xl text-xl" placeholder="e.g. Thursday Night Padel">
    </div>
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="text-sm font-semibold text-gray-600 block mb-2">Location</label>
        <input id="tournamentLocation" class="w-full p-5 border rounded-2xl" placeholder="e.g. Al Ain Club">
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-600 block mb-2">Time</label>
        <input id="tournamentTime" type="time" class="w-full p-5 border rounded-2xl">
      </div>
    </div>
    <button onclick="createTournament()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-3xl font-bold text-xl transition">
      Create / Save Tournament
    </button>
  </div>

  <!-- Share -->
  <div class="bg-white border rounded-3xl p-6 shadow-sm">
    <div class="text-sm text-gray-500 mb-3">Share this link with players</div>
    <div class="flex gap-3">
      <input id="shareLink" class="flex-1 p-5 border rounded-3xl text-sm bg-gray-50 font-mono" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-10 rounded-3xl font-semibold">Copy</button>
    </div>
  </div>

  <!-- Add Player -->
  <div class="flex gap-3">
    <input id="playerInput" class="flex-1 p-5 border rounded-3xl text-lg" placeholder="Enter player name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-10 rounded-3xl font-medium">Add Player</button>
  </div>

  <!-- Players List -->
  <div class="bg-white rounded-3xl border shadow-sm p-6">
    <div class="font-semibold text-lg mb-4">Players • <span id="playerCount" class="text-blue-600">0</span></div>
    <div id="playersList" class="space-y-3"></div>
  </div>

  <!-- Generate -->
  <div class="bg-white border rounded-3xl p-6 flex items-center gap-6">
    <div class="flex-1">
      <label class="text-sm font-semibold text-gray-600 block mb-2">Number of Courts</label>
      <input id="courtsInput" type="number" min="1" value="1" class="w-full p-5 border rounded-2xl text-center text-xl">
    </div>
    <button onclick="generate20Rounds()" class="flex-1 bg-gradient-to-r from-yellow-400 to-orange-500 py-6 rounded-3xl font-bold text-2xl shadow-md">
      Generate
    </button>
  </div>

  <!-- All Rounds -->
  <div id="allRoundsContainer" class="space-y-10"></div>

  <!-- Leaderboard -->
  <div class="mt-12">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-3xl font-bold">Leaderboard</h2>
      <button onclick="resetTournament()" class="bg-red-100 hover:bg-red-200 text-red-700 px-5 py-2 rounded-2xl text-sm font-medium">
        Reset Tournament
      </button>
    </div>
    <div class="bg-white border rounded-3xl shadow-sm overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="text-left py-4 px-6">#</th>
            <th class="text-left py-4 px-6">Name</th>
            <th class="text-center py-4">W</th>
            <th class="text-center py-4">T</th>
            <th class="text-center py-4">L</th>
            <th class="text-center py-4">P+</th>
            <th class="text-center py-4">P-</th>
            <th class="text-center py-4">+-</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody" class="text-sm"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
// ============== FIREBASE CONFIG ==============
const firebaseConfig = {
  apiKey: "AIzaSyAw5Y0Z8THy2guZ8BK7Q0D5LkHNeP9",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47",
  storageBucket: "padelpilot-b8e47.appspot.com",
  messagingSenderId: "1047531628612",
  appId: "1:1047531628612:web:0ee8f8bd27113c41f9c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null;
let players = [];
let allRounds = [];

function loadTournament() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("meet")) meetId = params.get("meet");

  if (!meetId) return;

  db.ref("tournaments/" + meetId).on("value", (snap) => {
    const data = snap.val() || {};
    players = data.players || [];
    allRounds = data.allRounds || [];

    document.getElementById("tournamentName").value = data.name || "";
    document.getElementById("shareLink").value = window.location.href;

    renderPlayers();
    renderAllRounds();
    updatePlayerCount();
    renderLeaderboard();
  });
}

function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if (!name) return alert("Please enter a tournament name");

  meetId = name.replace(/\s+/g, '-').toLowerCase().replace(/[^a-z0-9-]/g, '');

  const newUrl = window.location.origin + window.location.pathname + "?meet=" + meetId;
  window.history.pushState({}, "", newUrl);
  document.getElementById("shareLink").value = newUrl;

  db.ref("tournaments/" + meetId).update({
    name,
    location: document.getElementById("tournamentLocation").value.trim(),
    time: document.getElementById("tournamentTime").value,
    players,
    allRounds,
    timestamp: Date.now()
  }).then(() => alert("✅ Saved!"));
}

function addPlayer() {
  let name = document.getElementById("playerInput").value.trim().toLowerCase();
  if (!name || players.includes(name)) return;
  players.push(name);
  saveData();
  document.getElementById("playerInput").value = "";
}

function deletePlayer(index) {
  if (confirm(`Delete ${capitalize(players[index])}?`)) {
    players.splice(index, 1);
    saveData();
    renderPlayers();
    updatePlayerCount();
  }
}

function saveData() {
  if (!meetId) return;
  db.ref("tournaments/" + meetId).update({
    players,
    allRounds,
    timestamp: Date.now()
  });
}

function generate20Rounds() {
  if (players.length < 4) return alert("Need at least 4 players");

  const courts = parseInt(document.getElementById("courtsInput").value) || 1;
  allRounds = [];

  let playerPool = [...players];

  for (let r = 0; r < 20; r++) {
    playerPool = playerPool.sort(() => 0.5 - Math.random());
    let roundMatches = [];
    for (let i = 0; i < courts * 4; i += 4) {
      if (i + 3 >= playerPool.length) break;
      roundMatches.push({
        teamA: [playerPool[i], playerPool[i+1]],
        teamB: [playerPool[i+2], playerPool[i+3]],
        scoreA: "", scoreB: ""
      });
    }
    allRounds.push(roundMatches);
  }

  saveData();
  renderAllRounds();
  renderLeaderboard();
  alert("✅ 20 rounds generated!");
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer");
  container.innerHTML = '';

  allRounds.forEach((roundMatches, roundIndex) => {
    let html = `<div class="mb-10"><div class="text-xl font-bold text-blue-600 mb-4">Round ${roundIndex + 1}</div><div class="space-y-4">`;
    
    roundMatches.forEach((m, i) => {
      html += `
        <div class="match-card">
          <div class="team-block">
            ${capitalize(m.teamA[0])}<br>
            <span class="text-sm text-gray-500">${capitalize(m.teamA[1])}</span>
          </div>
          <div class="flex flex-col items-center gap-3">
            <div class="flex items-center gap-4">
              <input type="number" class="score-input" value="${m.scoreA || ''}" 
                     oninput="updateScore(${roundIndex}, ${i}, 'A', this.value)">
              <span class="text-3xl font-bold text-gray-400">VS</span>
              <input type="number" class="score-input" value="${m.scoreB || ''}" 
                     oninput="updateScore(${roundIndex}, ${i}, 'B', this.value)">
            </div>
            <div class="text-xs text-gray-400">Court ${i+1}</div>
          </div>
          <div class="team-block">
            ${capitalize(m.teamB[0])}<br>
            <span class="text-sm text-gray-500">${capitalize(m.teamB[1])}</span>
          </div>
        </div>`;
    });
    html += `</div></div>`;
    container.innerHTML += html;
  });
}

function updateScore(roundIndex, matchIndex, side, value) {
  if (!allRounds[roundIndex] || !allRounds[roundIndex][matchIndex]) return;
  allRounds[roundIndex][matchIndex]["score" + side] = value || "";
  saveData();
  renderLeaderboard();
}

function renderPlayers() {
  const el = document.getElementById("playersList");
  el.innerHTML = players.map((p, i) => `
    <div class="flex justify-between items-center bg-gray-50 px-5 py-4 rounded-2xl">
      <span>${i+1}. ${capitalize(p)}</span>
      <button onclick="deletePlayer(${i})" class="text-red-500 hover:text-red-700 text-2xl leading-none">×</button>
    </div>
  `).join("");
}

function updatePlayerCount() {
  document.getElementById("playerCount").textContent = players.length;
}

function renderLeaderboard() {
  const tbody = document.getElementById("leaderboardBody");
  tbody.innerHTML = '';

  players.forEach((player, index) => {
    let wins = 0, ties = 0, losses = 0, pointsFor = 0, pointsAgainst = 0;

    allRounds.forEach(round => {
      round.forEach(match => {
        const scoreA = parseFloat(match.scoreA) || 0;
        const scoreB = parseFloat(match.scoreB) || 0;

        if (match.teamA.includes(player)) {
          pointsFor += scoreA;
          pointsAgainst += scoreB;
          if (scoreA > scoreB) wins++;
          else if (scoreA === scoreB) ties++;
          else losses++;
        }
        if (match.teamB.includes(player)) {
          pointsFor += scoreB;
          pointsAgainst += scoreA;
          if (scoreB > scoreA) wins++;
          else if (scoreB === scoreA) ties++;
          else losses++;
        }
      });
    });

    const row = document.createElement('tr');
    row.className = "border-b hover:bg-gray-50";
    row.innerHTML = `
      <td class="py-4 px-6">${index + 1}</td>
      <td class="py-4 px-6 font-medium">${capitalize(player)}</td>
      <td class="text-center py-4">${wins}</td>
      <td class="text-center py-4">${ties}</td>
      <td class="text-center py-4">${losses}</td>
      <td class="text-center py-4 font-bold">${pointsFor}</td>
      <td class="text-center py-4">${pointsAgainst}</td>
      <td class="text-center py-4">${pointsFor - pointsAgainst}</td>
    `;
    tbody.appendChild(row);
  });
}

function resetTournament() {
  if (!confirm("Reset entire tournament? This cannot be undone.")) return;
  allRounds = [];
  saveData();
  renderAllRounds();
  renderLeaderboard();
  alert("Tournament has been reset.");
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("✅ Link copied!");
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

loadTournament();
</script>
</body>
</html>
