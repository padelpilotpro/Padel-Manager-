<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { background: #f8fafc; font-family: Inter, system-ui, sans-serif; color: #0f172a; }
    .match-card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px -2px rgb(0 0 0 / 0.1);
    }
    .team-block {
      width: 38%;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
    }
    .top-tabs {
      background: linear-gradient(90deg, #1e40af, #3b82f6);
      padding: 14px; 
      display: flex; 
      justify-content: center; 
      gap: 40px;
      color: white; 
      font-weight: 700;
    }
    .score-input {
      width: 75px;
      height: 55px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<div class="top-tabs">
  <a href="index.html" class="active">ARENA</a>
  <a href="leaderboard.html">LEADERBOARD</a>
</div>

<div class="max-w-4xl mx-auto px-5 py-8 space-y-8">

  <div class="text-center py-6 space-y-1">
    <div class="text-4xl font-black tracking-widest text-gray-900">PADELPILOT</div>
    <div class="text-blue-600 text-3xl font-bold">Arena</div>
  </div>

  <!-- Tournament Setup -->
  <div class="bg-white border rounded-3xl p-8 shadow-sm space-y-6">
    <div>
      <label class="text-sm font-semibold text-gray-600 block mb-2">Tournament Name</label>
      <input id="tournamentName" class="w-full p-5 border rounded-2xl text-xl" placeholder="e.g. Thursday Night Padel">
    </div>
    <div class="grid grid-cols-2 gap-6">
      <div>
        <label class="text-sm font-semibold text-gray-600 block mb-2">Location</label>
        <input id="tournamentLocation" class="w-full p-5 border rounded-2xl" placeholder="e.g. Al Ain Club">
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-600 block mb-2">Time</label>
        <input id="tournamentTime" type="time" class="w-full p-5 border rounded-2xl">
      </div>
    </div>
    <button onclick="createTournament()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-3xl font-bold text-xl transition">
      Create / Save Tournament
    </button>
  </div>

  <!-- Share -->
  <div class="bg-white border rounded-3xl p-6 shadow-sm">
    <div class="text-sm text-gray-500 mb-3">Share this link with players</div>
    <div class="flex gap-3">
      <input id="shareLink" class="flex-1 p-5 border rounded-3xl text-sm bg-gray-50 font-mono" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-10 rounded-3xl font-semibold">Copy</button>
    </div>
  </div>

  <!-- Add Player -->
  <div class="flex gap-3">
    <input id="playerInput" class="flex-1 p-5 border rounded-3xl text-lg" placeholder="Enter player name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-10 rounded-3xl font-medium">Add Player</button>
  </div>

  <!-- Players List -->
  <div class="bg-white rounded-3xl border shadow-sm p-6">
    <div class="font-semibold text-lg mb-4">Players • <span id="playerCount" class="text-blue-600">0</span></div>
    <div id="playersList" class="space-y-3"></div>
  </div>

  <!-- Courts & Generate -->
  <div class="bg-white border rounded-3xl p-6 flex items-center gap-6">
    <div class="flex-1">
      <label class="text-sm font-semibold text-gray-600 block mb-2">Number of Courts</label>
      <input id="courtsInput" type="number" min="1" value="1" class="w-full p-5 border rounded-2xl text-center text-xl">
    </div>
    <button onclick="generateMatches()" class="flex-1 bg-gradient-to-r from-yellow-400 to-orange-500 py-6 rounded-3xl font-bold text-2xl shadow-md">
      🎲 Generate Round
    </button>
  </div>

  <!-- Resting -->
  <div class="bg-amber-50 border border-amber-200 rounded-3xl p-6">
    <div class="text-amber-700 font-semibold mb-2">Currently Resting</div>
    <div id="restingPlayers" class="text-amber-800 text-lg">None</div>
  </div>

  <!-- Matches -->
  <div id="matchesContainer" class="space-y-5"></div>

</div>

<script>
// ============== FIREBASE CONFIG ==============
const firebaseConfig = {
  apiKey: "AIzaSyAw5Y0Z8THy2guZ8BK7Q0D5LkHNeP9",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47",
  storageBucket: "padelpilot-b8e47.appspot.com",
  messagingSenderId: "1047531628612",
  appId: "1:1047531628612:web:0ee8f8bd27113c41f9c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null;
let players = [];
let matches = [];

function loadTournament() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("meet")) meetId = params.get("meet");

  if (!meetId) {
    document.getElementById("shareLink").value = "Create a tournament first";
    return;
  }

  db.ref("tournaments/" + meetId).on("value", (snap) => {
    const data = snap.val() || {};
    players = data.players || [];
    matches = data.matches || [];

    document.getElementById("tournamentName").value = data.name || "";
    document.getElementById("tournamentLocation").value = data.location || "";
    document.getElementById("tournamentTime").value = data.time || "";
    document.getElementById("courtsInput").value = data.courts || 1;
    document.getElementById("shareLink").value = window.location.href;

    renderPlayers();
    renderMatches();
    updatePlayerCount();
    renderResting();
  });
}

function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if (!name) return alert("Please enter a tournament name");

  meetId = name.replace(/\s+/g, '-').toLowerCase().replace(/[^a-z0-9-]/g, '');

  const newUrl = window.location.origin + window.location.pathname + "?meet=" + meetId;
  window.history.pushState({}, "", newUrl);
  document.getElementById("shareLink").value = newUrl;

  db.ref("tournaments/" + meetId).update({
    name, location: document.getElementById("tournamentLocation").value.trim(),
    time: document.getElementById("tournamentTime").value,
    players, matches,
    courts: parseInt(document.getElementById("courtsInput").value) || 1,
    timestamp: Date.now()
  }).then(() => alert("✅ Tournament saved!"));
}

function addPlayer() {
  let name = document.getElementById("playerInput").value.trim().toLowerCase();
  if (!name || players.includes(name)) return;
  players.push(name);
  saveData();
  document.getElementById("playerInput").value = "";
}

function saveData() {
  if (!meetId) return;
  db.ref("tournaments/" + meetId).update({
    players, matches,
    courts: parseInt(document.getElementById("courtsInput").value) || 1,
    timestamp: Date.now()
  });
}

function generateMatches() {
  if (players.length < 4) return alert("Need at least 4 players");

  const courts = parseInt(document.getElementById("courtsInput").value) || 1;
  const maxPlayers = courts * 4;

  let shuffled = [...players].sort(() => 0.5 - Math.random());
  let playing = shuffled.slice(0, maxPlayers);

  matches = [];
  for (let i = 0; i < playing.length; i += 4) {
    if (i + 3 >= playing.length) break;
    matches.push({
      teamA: [playing[i], playing[i+1]],
      teamB: [playing[i+2], playing[i+3]],
      scoreA: "", scoreB: ""
    });
  }

  saveData();
  renderMatches();
  renderResting();
}

function updateScore(index, side, value) {
  if (!matches[index]) return;
  matches[index]["score" + side] = value || "";
  saveData();
}

function renderPlayers() {
  const el = document.getElementById("playersList");
  el.innerHTML = players.map((p, i) => `
    <div class="flex justify-between bg-gray-50 px-5 py-4 rounded-2xl">
      <span>${i+1}. ${capitalize(p)}</span>
    </div>
  `).join("");
}

function updatePlayerCount() {
  document.getElementById("playerCount").textContent = players.length;
}

function renderResting() {
  const courts = parseInt(document.getElementById("courtsInput").value) || 1;
  const restingList = players.length > (courts * 4) 
    ? players.slice(courts * 4).map(capitalize).join(" • ") 
    : "None";
  document.getElementById("restingPlayers").innerHTML = restingList;
}

function renderMatches() {
  const container = document.getElementById("matchesContainer");
  container.innerHTML = '';

  if (matches.length === 0) {
    container.innerHTML = `<div class="text-center py-16 text-gray-400">No matches yet. Generate a round!</div>`;
    return;
  }

  matches.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'match-card';
    card.innerHTML = `
      <div class="team-block">
        ${capitalize(m.teamA[0])}<br>
        <span class="text-sm text-gray-500">${capitalize(m.teamA[1])}</span>
      </div>
      <div class="flex flex-col items-center gap-3">
        <div class="flex items-center gap-4">
          <input type="number" class="score-input" value="\( {m.scoreA || ''}" oninput="updateScore( \){i}, 'A', this.value)">
          <span class="text-3xl font-bold text-gray-400">VS</span>
          <input type="number" class="score-input" value="\( {m.scoreB || ''}" oninput="updateScore( \){i}, 'B', this.value)">
        </div>
        <div class="text-xs text-gray-400">Court ${i+1}</div>
      </div>
      <div class="team-block">
        ${capitalize(m.teamB[0])}<br>
        <span class="text-sm text-gray-500">${capitalize(m.teamB[1])}</span>
      </div>
    `;
    container.appendChild(card);
  });
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("✅ Link copied!");
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

loadTournament();
</script>
</body>
</html>
