<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#f8fafc; font-family:Inter,sans-serif; }
.match-card { background:white; border-radius:20px; padding:20px; display:flex; justify-content:space-between; align-items:center; border:1px solid #e5e7eb; }
.team { width:35%; text-align:center; font-weight:600; }
.score { width:60px; height:50px; text-align:center; font-size:20px; border:2px solid #e5e7eb; border-radius:10px; }
</style>
</head>

<body>

<div class="max-w-4xl mx-auto p-6 space-y-8">

<h1 class="text-3xl font-bold text-center">PADELPILOT ARENA</h1>

<!-- Tournament -->
<input id="tName" placeholder="Tournament Name" class="w-full p-4 border rounded-xl">
<input id="tLocation" placeholder="Location" class="w-full p-4 border rounded-xl">
<input id="tTime" type="time" class="w-full p-4 border rounded-xl">
<button onclick="createTournament()" class="w-full bg-blue-600 text-white p-4 rounded-xl">Create Tournament</button>

<!-- Share -->
<input id="shareLink" readonly class="w-full p-3 border rounded-xl">

<!-- Player -->
<div class="flex gap-2">
<input id="playerInput" placeholder="Your name" class="flex-1 p-4 border rounded-xl">
<button onclick="addPlayer()" class="bg-blue-600 text-white px-6 rounded-xl">Add</button>
</div>

<div id="players"></div>

<!-- Courts -->
<input id="courts" type="number" value="1" class="w-full p-4 border rounded-xl">

<button onclick="generateRounds()" class="w-full bg-orange-500 text-white p-4 rounded-xl">Generate 20 Rounds</button>

<div id="rounds"></div>

<h2 class="text-2xl font-bold">Leaderboard</h2>
<div id="leaderboard"></div>

</div>

<script>
// Firebase
const firebaseConfig = {
 apiKey: "AIza...",
 authDomain: "padelpilot-b8e47.firebaseapp.com",
 databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
 projectId: "padelpilot-b8e47"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null;
let players = [];
let rounds = [];


// Create tournament
function createTournament(){
 const name = document.getElementById("tName").value;
 if(!name) return alert("Enter name");

 meetId = name.replace(/\s+/g,'-').toLowerCase();
 const url = location.origin + location.pathname + "?meet="+meetId;
 history.pushState({},'',url);

 document.getElementById("shareLink").value = url;

 db.ref("tournaments/"+meetId).update({
  name,
  location: tLocation.value,
  time: tTime.value,
  players,
  rounds
 });
}


// Load
function load(){
 const params = new URLSearchParams(location.search);
 if(params.get("meet")){
  meetId = params.get("meet");

  db.ref("tournaments/"+meetId).on("value", snap=>{
   const data = snap.val() || {};
   players = data.players || [];
   rounds = data.rounds || [];

   renderPlayers();
   renderRounds();
   renderLeaderboard();
  });
 }
}


// Add player (one per device)
function addPlayer(){
 if(!meetId) return alert("Create tournament first");

 if(localStorage.getItem("joined")) return alert("You already joined");

 const name = playerInput.value.trim().toLowerCase();
 if(!name || players.includes(name)) return;

 players.push(name);
 localStorage.setItem("joined","true");

 save();
 playerInput.value="";
}


// Save
function save(){
 db.ref("tournaments/"+meetId).update({
  players,
  rounds
 });
}


// Render players
function renderPlayers(){
 playersDiv = document.getElementById("players");
 playersDiv.innerHTML = players.map(p=>`<div>${p}</div>`).join("");
}


// Generate rounds (smart-ish)
function generateRounds(){
 const courts = parseInt(document.getElementById("courts").value);
 if(players.length < 4) return alert("Need players");

 rounds = [];
 let lastPlayed = {};

 for(let r=0;r<20;r++){
  let pool = [...players];

  // avoid back-to-back
  pool.sort((a,b)=>(lastPlayed[a]===r-1?1:0)-(lastPlayed[b]===r-1?1:0));

  let matches=[];
  for(let i=0;i<courts;i++){
   if(pool.length<4) break;

   let p1=pool.shift();
   let p2=pool.shift();
   let p3=pool.shift();
   let p4=pool.shift();

   matches.push({A:[p1,p2],B:[p3,p4],sA:"",sB:""});

   [p1,p2,p3,p4].forEach(p=>lastPlayed[p]=r);
  }

  rounds.push(matches);
 }

 save();
 renderRounds();
}


// Render rounds
function renderRounds(){
 const el = document.getElementById("rounds");
 el.innerHTML="";

 rounds.forEach((r,i)=>{
  let html=`<h3>Round ${i+1}</h3>`;
  r.forEach((m,j)=>{
   html+=`
   <div class="match-card">
    <div class="team">${m.A[0]}<br>${m.A[1]}</div>
    <div>
     <input class="score" value="${m.sA}" onchange="score(${i},${j},'A',this.value)">
     vs
     <input class="score" value="${m.sB}" onchange="score(${i},${j},'B',this.value)">
    </div>
    <div class="team">${m.B[0]}<br>${m.B[1]}</div>
   </div>`;
  });
  el.innerHTML+=html;
 });
}


// Score
function score(r,m,side,val){
 val=parseInt(val);
 if(val!==0 && val!==1) return alert("Only 0 or 1");

 rounds[r][m]["s"+side]=val;
 save();
 renderLeaderboard();
}


// Leaderboard
function renderLeaderboard(){
 let scores={};

 players.forEach(p=>scores[p]={w:0,l:0,pts:0});

 rounds.forEach(r=>{
  r.forEach(m=>{
   if(m.sA==1){
    m.A.forEach(p=>{scores[p].w++;scores[p].pts+=3});
    m.B.forEach(p=>scores[p].l++);
   }
   if(m.sB==1){
    m.B.forEach(p=>{scores[p].w++;scores[p].pts+=3});
    m.A.forEach(p=>scores[p].l++);
   }
  });
 });

 let sorted = Object.entries(scores).sort((a,b)=>b[1].pts-a[1].pts);

 leaderboard.innerHTML = sorted.map(([name,s],i)=>`
  <div>${i+1}. ${name} - ${s.pts} pts (${s.w}W ${s.l}L)</div>
 `).join("");
}


load();
</script>

</body>
</html>
