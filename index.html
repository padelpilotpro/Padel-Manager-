<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena | Pro</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05); }
    .match-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0; }
    .team-btn { flex: 1; padding: 12px; border-radius: 16px; border: 2px solid #f1f5f9; transition: all 0.2s; text-align: center; cursor: pointer; }
    .team-btn.winner { background: #eff6ff; border-color: #3b82f6; }
    .team-btn.winner span { color: #1d4ed8; font-weight: 800; }
    .nav-tab { flex: 1; text-align: center; padding: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; border-radius: 14px; transition: all 0.3s; color: #94a3b8; }
    .nav-tab.active { background: white; color: #3b82f6; box-shadow: 0 4px 12px -2px rgb(59 130 246 / 0.15); }
    .locked-field { background-color: #f1f5f9 !important; color: #64748b !important; cursor: not-allowed; border-color: #e2e8f0 !important; }
  </style>
</head>
<body>

<div class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur-md px-5 py-4 border-b border-slate-100">
  <div class="max-w-xl mx-auto flex bg-slate-200/50 p-1 rounded-2xl">
    <button onclick="switchTab('arena')" id="tab-arena" class="nav-tab active">Arena Hub</button>
    <button onclick="switchTab('stats')" id="tab-stats" class="nav-tab">Standings</button>
  </div>
</div>

<div class="max-w-xl mx-auto px-5 py-6 space-y-8">

  <div class="text-center">
    <div class="text-4xl font-black tracking-tighter text-slate-900">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <div id="devIndicator" class="hidden text-red-500 text-[10px] font-black uppercase mt-2 bg-red-50 px-3 py-1 rounded-full border border-red-100 inline-block tracking-widest">Admin Access Granted</div>
  </div>

  <div id="view-arena" class="space-y-8">
    
    <section class="glass-card space-y-4">
      <div class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Tournament Details</div>
      <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none font-bold" placeholder="Tournament Name">
      <div class="grid grid-cols-2 gap-4">
        <input id="tournamentLocation" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none" placeholder="Location">
        <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
      </div>
      <button id="updateBtn" onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold transition active:scale-95">Save & Lock Arena</button>
    </section>

    <div id="shareSection" class="glass-card hidden space-y-3">
      <div class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">Invite Players</div>
      <div class="flex gap-2">
        <input id="shareLink" class="flex-1 p-3 border rounded-xl text-[10px] bg-slate-50 font-mono text-slate-400 truncate" readonly />
        <button onclick="copyLink()" id="copyBtn" class="bg-blue-600 text-white px-5 rounded-xl text-xs font-bold whitespace-nowrap">Copy Link</button>
      </div>
    </div>

    <div class="space-y-3">
      <div class="flex gap-2">
        <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg outline-none focus:ring-2 ring-blue-100" placeholder="Your Name">
        <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold shadow-lg shadow-blue-100">Join</button>
      </div>
      <div class="glass-card">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mb-4">Checked-In Players</div>
        <div id="playersList" class="space-y-2"></div>
      </div>
    </div>

    <div class="glass-card space-y-4 text-center border-orange-100 shadow-orange-50/50 shadow-lg">
      <div class="flex justify-between items-center px-2">
        <label class="font-bold text-slate-700">Courts Available</label>
        <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold text-orange-600 bg-orange-50 border-orange-200">
      </div>
      <button onclick="generateFairRotation()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-md transition active:scale-95">ROTATE & ASSIGN PLAYERS</button>
    </div>

    <div id="allRoundsContainer" class="space-y-10 pb-10"></div>
  </div>

  <div id="view-stats" class="hidden space-y-6">
    <div class="bg-white border rounded-[32px] shadow-sm overflow-hidden border-slate-200">
      <div class="p-8 border-b bg-slate-50/50"><h2 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Current Ranking</h2></div>
      <table class="w-full">
        <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
          <tr><th class="py-4 px-6 text-left">Rank</th><th class="py-4 text-left">Player</th><th class="py-4 text-center">W-L</th><th class="py-4 text-right px-6">Pts</th></tr>
        </thead>
        <tbody id="leaderboardBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <div class="text-center py-10 border-t border-slate-100 mt-20">
    <button onclick="unlockDev()" class="text-[10px] text-slate-300 font-bold uppercase tracking-[0.4em] hover:text-blue-400 transition">Developer Key</button>
    <div id="adminResetContainer" class="hidden mt-6 flex justify-center gap-4">
        <button onclick="masterReset()" class="text-[10px] text-red-400 font-bold uppercase border border-red-100 px-6 py-2 rounded-full hover:bg-red-50">Wipe Tournament</button>
    </div>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DEV_PASSWORD = "padel-dev-123";

let meetId = null, players = [], allRounds = [], registeredIPs = [], isAdmin = false, userIP = "";
fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => userIP = d.ip);

function switchTab(target) {
  document.getElementById('view-arena').classList.add('hidden');
  document.getElementById('view-stats').classList.add('hidden');
  document.getElementById('tab-arena').classList.remove('active');
  document.getElementById('tab-stats').classList.remove('active');
  document.getElementById('view-' + target).classList.remove('hidden');
  document.getElementById('tab-' + target).classList.add('active');
}

function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    document.getElementById("shareSection").classList.remove("hidden");
    document.getElementById("shareLink").value = window.location.href;

    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      players = data.players || [];
      allRounds = data.rounds || [];
      registeredIPs = data.registeredIPs || [];

      // DYNAMIC LOCKING LOGIC
      if(data.name) {
          document.getElementById("tournamentName").value = data.name;
          document.getElementById("tournamentLocation").value = data.location || "";
          document.getElementById("tournamentTime").value = data.time || "";
          
          if(!isAdmin) {
              applyFieldLock(true);
          } else {
              applyFieldLock(false);
          }
      }
      renderPlayers(); renderAllRounds(); renderLeaderboard();
    });
  }
}

function applyFieldLock(lock) {
    const ids = ["tournamentName", "tournamentLocation", "tournamentTime"];
    ids.forEach(id => {
        const el = document.getElementById(id);
        el.readOnly = lock;
        lock ? el.classList.add("locked-field") : el.classList.remove("locked-field");
    });
    const btn = document.getElementById("updateBtn");
    btn.disabled = lock;
    btn.innerText = lock ? "Tournament Locked" : "Save Arena Details";
    btn.style.opacity = lock ? "0.5" : "1";
}

function unlockDev() {
  if(prompt("Enter Admin Pass:") === DEV_PASSWORD) {
    isAdmin = true;
    document.getElementById("devIndicator").classList.remove("hidden");
    document.getElementById("adminResetContainer").classList.remove("hidden");
    applyFieldLock(false);
    renderPlayers();
  }
}

function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if(!name) return alert("Missing name");
  meetId = name.replace(/\s+/g,'-').toLowerCase();
  
  db.ref("tournaments/" + meetId).update({ 
      name, 
      location: document.getElementById("tournamentLocation").value, 
      time: document.getElementById("tournamentTime").value, 
      createdAt: Date.now() 
  }).then(() => {
      history.pushState({}, '', "?meet=" + meetId);
      document.getElementById("shareSection").classList.remove("hidden");
      document.getElementById("shareLink").value = window.location.href;
  });
}

function addPlayer() {
  if(!meetId) return alert("Save arena details first!");
  if(!isAdmin && registeredIPs.includes(userIP)) return alert("You have already joined from this phone.");
  
  const name = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!name || players.some(p => p.name === name)) return alert("Unique name needed.");
  
  players.push({ name, checkedIn: false });
  if(!isAdmin) registeredIPs.push(userIP);
  saveData();
  document.getElementById("playerInput").value = "";
}

function toggleCheckIn(i) {
  if(!isAdmin) return;
  players[i].checkedIn = !players[i].checkedIn;
  saveData();
}

function selectWinner(ri, mi, team) {
  allRounds[ri][mi].sA = (team === 'A') ? "1" : "0";
  allRounds[ri][mi].sB = (team === 'B') ? "1" : "0";
  saveData();
}

function generateFairRotation() {
  const activePlayers = players.filter(p => p.checkedIn).map(p => p.name);
  const courts = parseInt(document.getElementById("courtsInput").value);
  if (activePlayers.length < 4) return alert("Need at least 4 ready players.");
  
  let playCounts = {}; activePlayers.forEach(p => playCounts[p] = 0);
  let existingRounds = allRounds.filter(r => r.some(m => m.sA !== "" || m.sB !== ""));
  
  existingRounds.forEach(r => r.forEach(m => [...m.tA, ...m.tB].forEach(p => { if(playCounts[p] !== undefined) playCounts[p]++; })));
  
  let newRounds = [...existingRounds];
  for (let r = newRounds.length; r < 15; r++) {
    let pool = [...activePlayers].sort((a,b) => playCounts[a] - playCounts[b] || Math.random() - 0.5);
    let matches = [];
    for (let c = 0; c < courts; c++) {
      if (pool.length >= 4) {
        let p1 = pool.shift(), p2 = pool.shift(), p3 = pool.shift(), p4 = pool.shift();
        matches.push({ tA: [p1, p2], tB: [p3, p4], sA: "", sB: "" });
        [p1, p2, p3, p4].forEach(p => playCounts[p]++);
      }
    }
    newRounds.push(matches);
  }
  allRounds = newRounds;
  saveData();
}

function renderPlayers() {
  document.getElementById("playersList").innerHTML = players.map((p, i) => `
    <div class="flex items-center justify-between p-4 border rounded-2xl ${p.checkedIn ? 'bg-green-50 border-green-100' : 'bg-slate-50 border-slate-100'}">
      <span class="text-sm font-bold uppercase ${p.checkedIn ? 'text-green-700' : 'text-slate-400'}">${p.name}</span>
      ${isAdmin ? `<button onclick="toggleCheckIn(${i})" class="text-[10px] font-bold px-4 py-1 rounded-lg bg-white border shadow-sm">Check In</button>` : `<span class="text-[9px] font-black uppercase ${p.checkedIn ? 'text-green-600' : 'text-slate-300'}">${p.checkedIn ? 'Ready' : 'Pending'}</span>`}
    </div>`).join("");
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer"); container.innerHTML = "";
  allRounds.forEach((r, i) => {
    let html = `<div class="space-y-4"><div class="flex items-center gap-3"><div class="h-[1px] flex-1 bg-slate-100"></div><span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Round ${i+1}</span><div class="h-[1px] flex-1 bg-slate-100"></div></div>`;
    r.forEach((m, j) => {
      html += `
        <div class="match-card flex gap-4 items-center shadow-sm">
          <button onclick="selectWinner(${i},${j},'A')" class="team-btn ${m.sA === "1" ? 'winner' : ''}">
            <span class="block text-[11px] uppercase">${m.tA[0]} & ${m.tA[1]}</span>
          </button>
          <div class="text-[9px] font-black text-slate-200">VS</div>
          <button onclick="selectWinner(${i},${j},'B')" class="team-btn ${m.sB === "1" ? 'winner' : ''}">
            <span class="block text-[11px] uppercase">${m.tB[0]} & ${m.tB[1]}</span>
          </button>
        </div>`;
    });
    container.innerHTML += html + "</div>";
  });
}

function renderLeaderboard() {
  let s = {}; players.forEach(p => s[p.name] = { w: 0, l: 0, pts: 0 });
  allRounds.forEach(r => r.forEach(m => {
    if(m.sA === "1") { m.tA.forEach(p=>{if(s[p]){s[p].pts+=3; s[p].w++}}); m.tB.forEach(p=>{if(s[p])s[p].l++}); }
    if(m.sB === "1") { m.tB.forEach(p=>{if(s[p]){s[p].pts+=3; s[p].w++}}); m.tA.forEach(p=>{if(s[p])s[p].l++}); }
  }));
  let sorted = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts);
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n,v], i) => `
    <tr>
      <td class="py-6 px-6 font-black text-slate-300 text-xs">#0${i+1}</td>
      <td class="py-6 font-bold uppercase text-xs text-slate-800">${n}</td>
      <td class="py-6 text-center text-[11px] font-bold text-slate-400">${v.w}W - ${v.l}L</td>
      <td class="py-6 text-right px-6 font-black text-blue-600 text-lg">${v.pts}</td>
    </tr>`).join("");
}

function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds, registeredIPs }); }
function masterReset() { if(confirm("Confirm WIPE? This cannot be undone.")) { db.ref("tournaments/" + meetId).set(null); location.href = location.origin + location.pathname; } }
function copyLink() { 
    const el = document.getElementById("shareLink"); 
    el.select(); 
    document.execCommand('copy'); 
    document.getElementById("copyBtn").innerText = "COPIED!";
    setTimeout(() => document.getElementById("copyBtn").innerText = "Copy Link", 2000);
}

loadArena();
</script>
</body>
</html>
