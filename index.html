<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena | Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05); }
    .match-card { background: white; border-radius: 24px; padding: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; margin-bottom: 12px; }
    .team-block { width: 35%; text-align: center; font-size: 14px; font-weight: 700; color: #1e293b; text-transform: uppercase; line-height: 1.2; }
    .score-input { width: 50px; height: 45px; text-align: center; font-size: 18px; font-weight: 800; border: 2px solid #f1f5f9; border-radius: 10px; background: #f8fafc; }
    .locked-input { background-color: #f1f5f9 !important; color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="max-w-xl mx-auto px-5 py-8 space-y-6">
  <div class="text-center">
    <div class="text-4xl font-black tracking-tighter text-slate-900">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <div id="devIndicator" class="hidden text-red-500 text-[10px] font-black uppercase mt-2 bg-red-50 px-3 py-1 rounded-full border border-red-100 inline-block">Admin Mode</div>
  </div>

  <section class="glass-card space-y-4">
    <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none" placeholder="Tournament Name">
    <div class="grid grid-cols-2 gap-4">
      <input id="tournamentLocation" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none" placeholder="Location">
      <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
    </div>
    <button id="updateBtn" onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Save Tournament</button>
  </section>

  <div class="space-y-3">
    <div class="flex gap-2">
      <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg outline-none" placeholder="Player Name">
      <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold">Join</button>
    </div>
    <div class="glass-card">
      <div class="font-bold text-xs text-slate-400 uppercase mb-4 flex justify-between">
        Roster <span class="text-blue-600"><span id="activeCount">0</span> Checked-In</span>
      </div>
      <div id="playersList" class="space-y-2"></div>
    </div>
  </div>

  <div class="glass-card space-y-4 text-center">
    <div class="flex justify-between items-center">
      <label class="font-bold">Available Courts</label>
      <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold bg-orange-50">
    </div>
    <button onclick="generateFairRotation()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg">
      UPDATE / ROTATE PLAYERS
    </button>
    <p class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Ensures players with fewer games play next</p>
  </div>

  <div id="allRoundsContainer" class="space-y-10"></div>

  <div id="leaderboardSection" class="bg-white border rounded-[32px] overflow-hidden">
    <table class="w-full">
      <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
        <tr><th class="py-4 px-6 text-left">Rank</th><th class="py-4 text-left">Player</th><th class="py-4 text-center">W-L</th><th class="py-4 text-right px-6">Pts</th></tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

  <div class="text-center py-10">
    <button onclick="unlockDev()" class="text-[10px] text-slate-300 font-bold uppercase tracking-widest">Developer Access</button>
    <div id="adminResetContainer" class="hidden mt-4">
        <button onclick="masterReset()" class="text-[10px] text-red-400 font-bold uppercase border p-2 rounded-full">Full Reset</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DEV_PASSWORD = "padel-dev-123";

let meetId = null, players = [], allRounds = [], isAdmin = false;

function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      players = data.players || [];
      allRounds = data.rounds || [];
      if(data.name && !isAdmin) lockInputs(true);
      renderPlayers(); renderAllRounds(); renderLeaderboard();
    });
  }
}

function lockInputs(lock) {
  const fields = ["tournamentLocation", "tournamentTime"];
  fields.forEach(f => {
    const el = document.getElementById(f);
    if(el) { el.readOnly = lock; if(lock) el.classList.add("locked-input"); }
  });
}

function unlockDev() {
  if(prompt("Admin Password:") === DEV_PASSWORD) {
    isAdmin = true;
    document.getElementById("devIndicator").classList.remove("hidden");
    document.getElementById("adminResetContainer").classList.remove("hidden");
    lockInputs(false);
    renderPlayers();
  }
}

function addPlayer() {
  const name = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!name || players.some(p => p.name === name)) return alert("Unique name required");
  players.push({ name, checkedIn: false });
  saveData();
  document.getElementById("playerInput").value = "";
}

function toggleCheckIn(i) {
  if(!isAdmin) return;
  players[i].checkedIn = !players[i].checkedIn;
  saveData();
}

function generateFairRotation() {
  const activeNames = players.filter(p => p.checkedIn).map(p => p.name);
  const courts = parseInt(document.getElementById("courtsInput").value);
  if (activeNames.length < 4) return alert("At least 4 checked-in players needed.");

  // TRACK PLAY COUNT: How many times has each player appeared in the schedule?
  let playCounts = {};
  activeNames.forEach(name => playCounts[name] = 0);
  
  // Only keep rounds that are ALREADY FINISHED (have scores)
  let existingRounds = allRounds.filter(r => r.some(m => m.sA !== "" || m.sB !== ""));
  
  // Count plays in existing rounds
  existingRounds.forEach(r => r.forEach(m => {
    [...m.tA, ...m.tB].forEach(p => { if(playCounts[p] !== undefined) playCounts[p]++; });
  }));

  let newRounds = [...existingRounds];

  // Generate 15 rounds total, prioritizing people who haven't played
  for (let r = newRounds.length; r < 15; r++) {
    let roundMatches = [];
    let pool = [...activeNames].sort((a, b) => {
      // Sort by play count first (lowest plays first), then randomize if counts are equal
      if (playCounts[a] !== playCounts[b]) return playCounts[a] - playCounts[b];
      return Math.random() - 0.5;
    });

    for (let c = 0; c < courts; c++) {
      if (pool.length >= 4) {
        let p1 = pool.shift(), p2 = pool.shift(), p3 = pool.shift(), p4 = pool.shift();
        roundMatches.push({ tA: [p1, p2], tB: [p3, p4], sA: "", sB: "" });
        [p1, p2, p3, p4].forEach(p => playCounts[p]++);
      }
    }
    newRounds.push(roundMatches);
  }
  allRounds = newRounds;
  saveData();
}

function renderPlayers() {
  const active = players.filter(p => p.checkedIn).length;
  document.getElementById("activeCount").innerText = active;
  document.getElementById("playersList").innerHTML = players.map((p, i) => `
    <div class="flex items-center justify-between p-3 border rounded-2xl ${p.checkedIn ? 'bg-green-50 border-green-100' : 'bg-slate-50'}">
      <span class="font-bold uppercase ${p.checkedIn ? 'text-green-700' : 'text-slate-400'}">${p.name}</span>
      ${isAdmin ? `<button onclick="toggleCheckIn(${i})" class="text-[10px] font-bold border px-2 py-1 rounded-lg bg-white">Toggle</button>` : ''}
    </div>`).join("");
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer");
  container.innerHTML = "";
  allRounds.forEach((r, i) => {
    let html = `<div class="space-y-3"><div class="text-[10px] font-black text-slate-300 uppercase text-center tracking-tighter">Round ${i+1}</div>`;
    r.forEach((m, j) => {
      html += `
        <div class="match-card shadow-sm">
          <div class="team-block">${m.tA[0]}<br>${m.tA[1]}</div>
          <div class="flex gap-2">
            <input class="score-input" value="${m.sA}" onchange="updateScore(${i},${j},'sA',this.value)">
            <input class="score-input" value="${m.sB}" onchange="updateScore(${i},${j},'sB',this.value)">
          </div>
          <div class="team-block">${m.tB[0]}<br>${m.tB[1]}</div>
        </div>`;
    });
    container.innerHTML += html + "</div>";
  });
}

function updateScore(ri, mi, team, val) {
  if(val === "1" || val === "0") {
    allRounds[ri][mi][team] = val;
    saveData();
  }
}

function renderLeaderboard() {
  let s = {}; players.forEach(p => s[p.name] = { w: 0, l: 0, pts: 0 });
  allRounds.forEach(r => r.forEach(m => {
    if(m.sA === "1") { m.tA.forEach(p=>{if(s[p])s[p].pts+=3}); m.tB.forEach(p=>{if(s[p])s[p].l++}); }
    if(m.sB === "1") { m.tB.forEach(p=>{if(s[p])s[p].pts+=3}); m.tA.forEach(p=>{if(s[p])s[p].l++}); }
  }));
  let sorted = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts);
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n,v], i) => `
    <tr class="border-b"><td class="py-4 px-6 font-bold text-slate-300">#${i+1}</td>
    <td class="font-bold uppercase text-xs">${n}</td><td class="text-center font-bold text-slate-400 text-xs">${v.w}-${v.l}</td>
    <td class="text-right px-6 font-black text-blue-600">${v.pts}</td></tr>`).join("");
}

function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if(!name) return alert("Enter Name");
  meetId = name.replace(/\s+/g,'-').toLowerCase();
  db.ref("tournaments/" + meetId).update({ name, location: document.getElementById("tournamentLocation").value, time: document.getElementById("tournamentTime").value, createdAt: Date.now(), players });
  history.pushState({}, '', "?meet=" + meetId);
}

function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds }); }
function masterReset() { if(confirm("Wipe?")) { db.ref("tournaments/" + meetId).set(null); location.href = location.origin + location.pathname; } }
loadArena();
</script>
</body>
</html>
