<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05); }
    .match-card { background: white; border-radius: 24px; padding: 24px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e8f0; }
    .team-block { width: 38%; text-align: center; font-size: 16px; font-weight: 700; color: #1e293b; text-transform: uppercase; }
    .score-input { width: 60px; height: 50px; text-align: center; font-size: 20px; font-weight: 800; border: 2px solid #f1f5f9; border-radius: 12px; background: #f8fafc; }
    .score-input:focus { border-color: #3b82f6; outline: none; background: white; }
  </style>
</head>
<body>

<div class="max-w-xl mx-auto px-5 py-8 space-y-8">

  <div class="text-center py-4">
    <div class="text-4xl font-black tracking-tighter text-slate-900">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <p id="displayStatus" class="text-slate-400 text-[10px] font-bold uppercase tracking-[0.3em] mt-2">Open Arena Access</p>
  </div>

  <section class="glass-card space-y-4">
    <h3 class="text-slate-800 font-extrabold text-lg">Arena Setup</h3>
    <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 focus:bg-white transition-all outline-none" placeholder="Tournament Name (e.g. Night League)">
    <div class="grid grid-cols-2 gap-4">
      <input id="tournamentLocation" class="w-full p-4 border rounded-2xl bg-slate-50 focus:bg-white transition-all outline-none" placeholder="Location">
      <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl bg-slate-50 focus:bg-white transition-all outline-none">
    </div>
    <button onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition active:scale-95">Save Tournament Details</button>
  </section>

  <div class="glass-card p-5">
    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block tracking-widest">Invite Players</label>
    <div class="flex gap-2">
      <input id="shareLink" class="flex-1 p-3 border rounded-xl text-xs bg-slate-50 font-mono text-slate-500" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-5 rounded-xl text-xs font-bold">Copy</button>
    </div>
  </div>

  <div class="flex gap-2">
    <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg shadow-sm outline-none focus:ring-2 ring-blue-100" placeholder="Enter Your Name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold shadow-lg shadow-blue-100 transition active:scale-95">Join</button>
  </div>

  <div class="glass-card">
    <div class="font-bold text-xs text-slate-400 uppercase tracking-tighter mb-4 flex justify-between">
      Current Roster <span><span id="playerCount" class="text-blue-600">0</span> Registered</span>
    </div>
    <div id="playersList" class="flex flex-wrap gap-2 min-h-[40px]"></div>
  </div>

  <div class="glass-card space-y-4 text-center border-orange-100">
    <div class="flex justify-between items-center">
      <label class="font-bold text-slate-700">Number of Courts</label>
      <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold text-orange-600 bg-orange-50">
    </div>
    <button onclick="generate20Rounds()" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg shadow-orange-100 transition active:scale-95">
      GENERATE MATCHES
    </button>
  </div>

  <div id="allRoundsContainer" class="space-y-10"></div>

  <div class="bg-white border rounded-[32px] shadow-sm overflow-hidden border-slate-200">
    <div class="p-6 border-b bg-slate-50/50">
      <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">Leaderboard</h2>
    </div>
    <table class="w-full">
      <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
        <tr>
          <th class="py-4 px-6 text-left">Rank</th>
          <th class="py-4 text-left">Player</th>
          <th class="py-4 text-center">W-L</th>
          <th class="py-4 text-right px-6">Points</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody" class="divide-y divide-slate-100 font-medium text-slate-700"></tbody>
    </table>
  </div>

  <div class="text-center py-12">
    <button onclick="developerReset()" class="text-[10px] text-red-300 font-bold uppercase tracking-[0.4em] hover:text-red-500 transition-colors">Master Reset</button>
  </div>

</div>

<script>
// ============== DATABASE CONFIG ==============
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DEV_PASSWORD = "padel-dev-123";

let meetId = null;
let players = [];
let allRounds = [];

// --- INITIAL LOAD ---
function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      
      // Auto-Reset Logic (24 Hours)
      if (data.createdAt && (Date.now() - data.createdAt > 24 * 60 * 60 * 1000)) {
        db.ref("tournaments/" + meetId).set(null);
        localStorage.removeItem("joined_" + meetId);
        location.reload();
        return;
      }

      players = data.players || [];
      allRounds = data.rounds || [];
      
      if(data.name) {
        document.getElementById("tournamentName").value = data.name;
        document.getElementById("tournamentLocation").value = data.location || "";
        document.getElementById("tournamentTime").value = data.time || "";
      }
      document.getElementById("shareLink").value = window.location.href;
      
      renderPlayers();
      renderAllRounds();
      renderLeaderboard();
    });
  }
}

// --- CORE ACTIONS ---
function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  const loc = document.getElementById("tournamentLocation").value.trim();
  const time = document.getElementById("tournamentTime").value;
  
  if(!name) return alert("Please enter a tournament name.");
  const newId = name.replace(/\s+/g,'-').toLowerCase();
  
  if(!meetId || meetId !== newId) {
    meetId = newId;
    const url = location.origin + location.pathname + "?meet=" + meetId;
    history.pushState({}, '', url);
    db.ref("tournaments/" + meetId).update({
      name, location: loc, time: time,
      createdAt: Date.now(),
      players: players, rounds: allRounds
    });
  } else {
    db.ref("tournaments/" + meetId).update({ name, location: loc, time: time });
  }
  alert("Tournament Updated.");
}

function addPlayer() {
  if(!meetId) return alert("Create/Save a tournament first.");
  if(localStorage.getItem("joined_" + meetId)) return alert("You've already joined this tournament.");
  
  const name = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!name || players.includes(name)) return alert("Enter a unique name.");
  
  players.push(name);
  localStorage.setItem("joined_" + meetId, "true");
  saveData();
  document.getElementById("playerInput").value = "";
}

function generate20Rounds() {
  const courts = parseInt(document.getElementById("courtsInput").value);
  if(players.length < 4) return alert("Need at least 4 players.");
  if(!confirm("Generate new matches? This will reset all current scores.")) return;

  allRounds = [];
  let lastPlayed = {};
  for(let r=0; r<20; r++) {
    let pool = [...players];
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    pool.sort((a,b) => (lastPlayed[a] === r-1 ? 1 : 0) - (lastPlayed[b] === r-1 ? 1 : 0));
    let matches = [];
    for(let c=0; c<courts; c++) {
      if(pool.length < 4) break;
      let p1 = pool.shift(), p2 = pool.shift(), p3 = pool.shift(), p4 = pool.shift();
      matches.push({ tA: [p1,p2], tB: [p3,p4], sA: "", sB: "" });
      [p1,p2,p3,p4].forEach(p => lastPlayed[p] = r);
    }
    allRounds.push(matches);
  }
  saveData();
}

function developerReset() {
  const p = prompt("Enter Master Password to WIPE EVERYTHING:");
  if(p === DEV_PASSWORD) {
    if(confirm("DANGER: This will delete all players and rounds. Continue?")) {
      db.ref("tournaments/" + meetId).set(null);
      localStorage.clear();
      location.href = location.origin + location.pathname;
    }
  } else { alert("Incorrect password."); }
}

// --- UTILS & RENDERERS ---
function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds }); }

function renderPlayers() {
  document.getElementById("playerCount").innerText = players.length;
  document.getElementById("playersList").innerHTML = players.map(p => 
    `<span class="bg-blue-50 border border-blue-100 px-4 py-2 rounded-full text-[11px] font-bold uppercase text-blue-600 shadow-sm">${p}</span>`
  ).join("");
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer");
  container.innerHTML = "";
  allRounds.forEach((r, i) => {
    let html = `<div class="space-y-4">
      <div class="flex items-center gap-4">
        <div class="h-[1px] flex-1 bg-slate-200"></div>
        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Round ${i+1}</span>
        <div class="h-[1px] flex-1 bg-slate-200"></div>
      </div>`;
    r.forEach((m, j) => {
      html += `
        <div class="match-card shadow-sm border-slate-100">
          <div class="team-block text-slate-800">${m.tA[0]}<br>${m.tA[1]}</div>
          <div class="flex items-center gap-2">
            <input class="score-input" value="${m.sA}" onchange="updateScore(${i},${j},'sA',this.value)">
            <span class="text-[9px] font-black text-slate-300">VS</span>
            <input class="score-input" value="${m.sB}" onchange="updateScore(${i},${j},'sB',this.value)">
          </div>
          <div class="team-block text-slate-800">${m.tB[0]}<br>${m.tB[1]}</div>
        </div>`;
    });
    container.innerHTML += html + "</div>";
  });
}

function updateScore(ri, mi, team, val) {
  val = parseInt(val);
  if(val !== 0 && val !== 1) return renderAllRounds();
  allRounds[ri][mi][team] = val;
  saveData();
}

function renderLeaderboard() {
  let s = {};
  players.forEach(p => s[p] = { w: 0, l: 0, pts: 0 });
  allRounds.forEach(r => r.forEach(m => {
    if(m.sA == 1) { m.tA.forEach(p=>{s[p].w++; s[p].pts+=3}); m.tB.forEach(p=>s[p].l++); }
    if(m.sB == 1) { m.tB.forEach(p=>{s[p].w++; s[p].pts+=3}); m.tA.forEach(p=>s[p].l++); }
  }));
  let sorted = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts);
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n,v], i) => `
    <tr>
      <td class="py-5 px-6 font-black text-slate-300 text-xs">#0${i+1}</td>
      <td class="py-5 font-bold uppercase text-xs">${n}</td>
      <td class="py-5 text-center text-[10px] font-bold text-slate-400">${v.w}W - ${v.l}L</td>
      <td class="py-5 text-right px-6 font-black text-blue-600">${v.pts}</td>
    </tr>
  `).join("");
}

function copyLink() {
  const el = document.getElementById("shareLink");
  el.select();
  document.execCommand('copy');
  alert("Invite link copied to clipboard!");
}

loadArena();
</script>
</body>
</html>
