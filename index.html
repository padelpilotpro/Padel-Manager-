<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena | Pro</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
  
  body { 
    background-color: #ffffff; 
    color: #1a1a1a; 
    font-family: 'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .glass-card {
    background: #ffffff;
    border: 1px solid #f0f0f0;
    border-radius: 24px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    transition: transform 0.2s ease;
  }

  .match-card {
    background: #fcfcfc;
    border: 1px solid #eeeeee;
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 12px;
  }

  .input-field {
    background: #f9f9f9;
    border: 1px solid #e2e2e2;
    border-radius: 12px;
    padding: 12px 16px;
    transition: all 0.3s ease;
  }

  .input-field:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
  }

  .btn-primary {
    background: #1a1a1a;
    color: white;
    font-weight: 600;
    transition: opacity 0.2s;
  }

  .btn-primary:active { opacity: 0.8; }

  .score-box {
    width: 50px;
    height: 45px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    border-radius: 8px;
    border: 1px solid #d1d5db;
  }

  .team-label { font-size: 0.9rem; font-weight: 600; color: #4b5563; }
</style>
</head>

<body class="pb-20">

<div class="max-w-md mx-auto p-5 space-y-6">

  <header class="text-center pt-4">
    <h1 class="text-2xl font-extrabold tracking-tight">PADELPILOT <span class="text-blue-600">ARENA</span></h1>
    <p class="text-gray-400 text-sm">Tournament Management Hub</p>
  </header>

  <section class="glass-card p-5 space-y-4">
    <div class="space-y-2">
      <label class="text-xs font-bold uppercase text-gray-400 ml-1">Admin Access</label>
      <input id="devPassword" type="password" placeholder="Developer Password" class="w-full input-field">
    </div>

    <div class="grid grid-cols-1 gap-3">
      <input id="tName" placeholder="Tournament Name" class="input-field">
      <div class="flex gap-2">
        <input id="tLocation" placeholder="Location" class="flex-1 input-field">
        <input id="tTime" type="time" class="w-32 input-field">
      </div>
    </div>
    
    <button onclick="createTournament()" class="w-full btn-primary p-4 rounded-xl shadow-lg">Initialize Arena</button>
  </section>

  <div id="activeTournamentUI" class="space-y-6">
    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
      <p class="text-[10px] font-bold text-blue-500 uppercase mb-1">Shareable Tournament Link</p>
      <input id="shareLink" readonly class="w-full bg-transparent text-sm text-blue-800 font-medium focus:outline-none cursor-pointer">
    </div>

    <div class="space-y-3">
      <h2 class="text-lg font-bold flex items-center gap-2">
        <span class="w-2 h-6 bg-blue-600 rounded-full"></span> Roster
      </h2>
      <div class="flex gap-2">
        <input id="playerInput" placeholder="Player Name" class="flex-1 input-field">
        <button onclick="addPlayer()" class="bg-blue-600 text-white px-5 rounded-xl font-bold">+</button>
      </div>
      <div id="players" class="flex flex-wrap gap-2 pt-2"></div>
    </div>

    <div class="glass-card p-5 space-y-4">
       <div class="flex justify-between items-center">
         <span class="font-bold">Total Courts</span>
         <input id="courts" type="number" value="1" min="1" class="w-16 text-center font-bold bg-gray-100 p-2 rounded-lg">
       </div>
       <button onclick="generateRounds()" class="w-full bg-orange-500 text-white p-4 rounded-xl font-bold">Generate 20 Fair Rounds</button>
    </div>

    <div id="rounds" class="space-y-8"></div>

    <div class="glass-card p-6">
      <h2 class="text-xl font-bold mb-4">🏆 Leaderboard</h2>
      <div id="leaderboard" class="divide-y divide-gray-100"></div>
    </div>
  </div>

</div>

<script>
// Integrated Firebase Config (Using your updated API Key)
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DEV_PASSWORD = "padel-dev-123";

let meetId = null;
let players = [];
let rounds = [];
let tournamentCreated = false;

// Logic from 1st Code Base
function createTournament(){
  const name = document.getElementById("tName").value.trim();
  const locationVal = document.getElementById("tLocation").value.trim();
  const timeVal = document.getElementById("tTime").value;
  const devPass = document.getElementById("devPassword").value;

  if(!name) return alert("Enter tournament name");
  const newMeetId = name.replace(/\s+/g,'-').toLowerCase();

  if(!tournamentCreated || meetId !== newMeetId){
    meetId = newMeetId;
    const url = location.origin + location.pathname + "?meet="+meetId;
    history.pushState({},'',url);
    document.getElementById("shareLink").value = url;

    db.ref("tournaments/"+meetId).update({
      name, location: locationVal, time: timeVal, players, rounds
    });

    tournamentCreated = true;
    alert("Arena Ready.");
    return;
  }

  if(devPass !== DEV_PASSWORD) return alert("Admin password required to edit.");

  db.ref("tournaments/"+meetId).update({ name, location: locationVal, time: timeVal });
  alert("Details Updated.");
}

function load(){
  const params = new URLSearchParams(location.search);
  if(params.get("meet")){
    meetId = params.get("meet");
    db.ref("tournaments/"+meetId).on("value", snap=>{
      const data = snap.val() || {};
      players = data.players || [];
      rounds = data.rounds || [];
      if(data.name) document.getElementById("tName").value = data.name;
      document.getElementById("shareLink").value = location.origin + location.pathname + "?meet="+meetId;
      tournamentCreated = true;
      renderPlayers();
      renderRounds();
      renderLeaderboard();
    });
  }
}

function addPlayer(){
  if(!meetId) return alert("Create tournament first");
  if(localStorage.getItem("joined")) return alert("Joined already");
  const name = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!name || players.includes(name)) return;
  players.push(name);
  localStorage.setItem("joined","true");
  save();
  document.getElementById("playerInput").value="";
}

function save(){
  if(meetId) db.ref("tournaments/"+meetId).update({ players, rounds });
}

function renderPlayers(){
  const playersDiv = document.getElementById("players");
  playersDiv.innerHTML = players
    .map(p=>`<span class="bg-gray-100 text-[12px] font-bold px-3 py-1.5 rounded-full border border-gray-200">${p}</span>`)
    .join("");
}

function generateRounds(){
  const courts = parseInt(document.getElementById("courts").value);
  if(players.length < 4) return alert("Need 4 players");
  
  rounds = [];
  let lastPlayed = {};

  for(let r=0; r<20; r++){
    let pool = [...players];
    // Shuffle
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // Fair-resting sort
    pool.sort((a,b)=>(lastPlayed[a]===r-1?1:0)-(lastPlayed[b]===r-1?1:0));

    let matches=[];
    for(let i=0; i<courts; i++){
      if(pool.length < 4) break;
      let p1=pool.shift(), p2=pool.shift(), p3=pool.shift(), p4=pool.shift();
      matches.push({A:[p1,p2], B:[p3,p4], sA:"", sB:""});
      [p1,p2,p3,p4].forEach(p=>lastPlayed[p]=r);
    }
    rounds.push(matches);
  }
  save();
}

function renderRounds(){
  const el = document.getElementById("rounds");
  el.innerHTML="";
  rounds.forEach((r,i)=>{
    let html=`<div class="space-y-3"><h3 class="text-sm font-black text-gray-400 uppercase tracking-widest">Round ${i+1}</h3>`;
    r.forEach((m,j)=>{
      html+=`
      <div class="match-card flex items-center justify-between shadow-sm">
        <div class="w-1/3 text-center"><p class="team-label">${m.A[0]}</p><p class="team-label">${m.A[1]}</p></div>
        <div class="flex items-center gap-2">
          <input class="score-box" value="${m.sA}" onchange="score(${i},${j},'A',this.value)">
          <span class="text-xs font-bold text-gray-300">VS</span>
          <input class="score-box" value="${m.sB}" onchange="score(${i},${j},'B',this.value)">
        </div>
        <div class="w-1/3 text-center"><p class="team-label">${m.B[0]}</p><p class="team-label">${m.B[1]}</p></div>
      </div>`;
    });
    el.innerHTML += html + `</div>`;
  });
}

function score(r,m,side,val){
  val=parseInt(val);
  if(val!==0 && val!==1){
    alert("Use 1 for Win, 0 for Loss.");
    renderRounds();
    return;
  }
  rounds[r][m]["s"+side]=val;
  save();
  renderLeaderboard();
}

function renderLeaderboard(){
  let s={};
  players.forEach(p=>s[p]={w:0, l:0, pts:0});
  rounds.forEach(r=>r.forEach(m=>{
    if(m.sA==1){ m.A.forEach(p=>{s[p].w++;s[p].pts+=3}); m.B.forEach(p=>s[p].l++); }
    if(m.sB==1){ m.B.forEach(p=>{s[p].w++;s[p].pts+=3}); m.A.forEach(p=>s[p].l++); }
  }));
  let sorted = Object.entries(s).sort((a,b)=>b[1].pts-a[1].pts);
  document.getElementById("leaderboard").innerHTML = sorted.map(([n,v],i)=>`
    <div class="flex justify-between items-center py-3">
      <div class="flex items-center gap-3">
        <span class="text-xs font-bold text-gray-400">#${i+1}</span>
        <span class="font-bold text-gray-800 capitalize">${n}</span>
      </div>
      <div class="text-right">
        <span class="text-blue-600 font-bold">${v.pts} pts</span>
        <p class="text-[10px] text-gray-400 font-bold uppercase">${v.w}W - ${v.l}L</p>
      </div>
    </div>
  `).join("");
}

load();
</script>
</body>
</html>
