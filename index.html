<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .match-card {
      background: white;
      border-radius: 24px;
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05);
    }
    .team-block { width: 38%; text-align: center; font-size: 16px; font-weight: 700; color: #1e293b; text-transform: uppercase; }
    .score-input {
      width: 60px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      border: 2px solid #f1f5f9;
      border-radius: 12px;
      background: #f8fafc;
    }
    .score-input:focus { border-color: #3b82f6; outline: none; background: white; }
    .admin-only { display: none; }
  </style>
</head>
<body>

<div class="max-w-xl mx-auto px-5 py-8 space-y-8">

  <div class="text-center py-4">
    <div class="text-3xl font-extrabold tracking-tighter text-slate-900">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <p id="displayTournamentName" class="text-slate-400 text-xs font-bold uppercase tracking-widest mt-1">Tournament Hub</p>
  </div>

  <section id="adminSection" class="admin-only bg-white border-2 border-blue-100 rounded-3xl p-6 shadow-xl space-y-4">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="text-blue-600 font-bold text-sm uppercase">Admin Config</h3>
      <button onclick="closeAdmin()" class="text-slate-300 hover:text-slate-500">✕</button>
    </div>
    <input id="tournamentName" class="w-full p-4 border rounded-2xl" placeholder="Tournament Name">
    <div class="grid grid-cols-2 gap-4">
      <input id="tournamentLocation" class="w-full p-4 border rounded-2xl" placeholder="Location">
      <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl">
    </div>
    <button onclick="createTournament()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold">Save Master Settings</button>
    
    <div class="pt-4">
      <p class="text-[10px] font-bold text-red-500 uppercase mb-2">Manage Roster</p>
      <div id="adminRoster" class="space-y-2"></div>
    </div>
  </section>

  <div class="bg-white border rounded-3xl p-5 shadow-sm">
    <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block">Invite Link</label>
    <div class="flex gap-2">
      <input id="shareLink" class="flex-1 p-3 border rounded-xl text-xs bg-slate-50 font-mono text-slate-500" readonly />
      <button onclick="copyLink()" class="bg-slate-900 text-white px-5 rounded-xl text-xs font-bold">Copy</button>
    </div>
  </div>

  <div class="flex gap-2">
    <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg shadow-sm focus:ring-2 ring-blue-100 outline-none" placeholder="Your Name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold transition active:scale-95">Join</button>
  </div>

  <div class="bg-white rounded-3xl border shadow-sm p-6">
    <div class="font-bold text-sm text-slate-400 uppercase tracking-tight mb-4 flex justify-between">
      Players <span><span id="playerCount" class="text-blue-600">0</span> Active</span>
    </div>
    <div id="playersList" class="flex flex-wrap gap-2"></div>
  </div>

  <div class="bg-white border rounded-3xl p-6 space-y-4 shadow-sm">
    <div class="flex justify-between items-center">
      <label class="font-bold text-slate-700">Courts</label>
      <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold">
    </div>
    <button onclick="generate20Rounds()" class="w-full bg-gradient-to-r from-orange-500 to-orange-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg shadow-orange-100 transition active:scale-95">
      GENERATE ROUNDS
    </button>
  </div>

  <div id="allRoundsContainer" class="space-y-10"></div>

  <div class="bg-white border rounded-[32px] shadow-sm overflow-hidden">
    <div class="p-6 border-b">
      <h2 class="text-xl font-black text-slate-800 uppercase">Standings</h2>
    </div>
    <table class="w-full">
      <thead class="bg-slate-50 text-[10px] uppercase font-bold text-slate-400">
        <tr>
          <th class="py-4 px-6 text-left">Pos</th>
          <th class="py-4 text-left">Player</th>
          <th class="py-4 text-center">W-L</th>
          <th class="py-4 text-right px-6">Pts</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody" class="divide-y divide-slate-50 font-medium text-slate-700"></tbody>
    </table>
  </div>

  <div class="text-center py-8">
    <button onclick="unlockDev()" class="text-[10px] text-slate-300 font-bold uppercase tracking-[0.3em] hover:text-slate-500">Developer Settings</button>
  </div>

</div>

<script>
// ============== FIREBASE & SECURITY ==============
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DEV_PASSWORD = "padel-dev-123";

let meetId = null;
let players = [];
let allRounds = [];

// --- LOAD TOURNAMENT & RESET LOGIC ---
function loadTournament() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      
      // 24 Hour Auto-Reset
      if (data.createdAt) {
        const now = Date.now();
        if (now - data.createdAt > 24 * 60 * 60 * 1000) {
          db.ref("tournaments/" + meetId).update({ players: [], rounds: [], createdAt: Date.now() });
          localStorage.removeItem("joined_" + meetId);
          alert("Resetting arena for a new 24-hour cycle.");
          return;
        }
      }

      players = data.players || [];
      allRounds = data.rounds || [];
      
      if(data.name) {
        document.getElementById("tournamentName").value = data.name;
        document.getElementById("displayTournamentName").innerText = data.name;
      }
      document.getElementById("shareLink").value = window.location.href;
      
      renderPlayers();
      renderAllRounds();
      renderLeaderboard();
      if(document.getElementById('adminSection').style.display === 'block') renderAdminRoster();
    });
  }
}

// --- ADMIN & SETUP ---
function unlockDev() {
  const p = prompt("Password:");
  if(p === DEV_PASSWORD) {
    document.getElementById('adminSection').style.display = 'block';
    renderAdminRoster();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function closeAdmin() { document.getElementById('adminSection').style.display = 'none'; }

function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if(!name) return alert("Enter a name");
  const newId = name.replace(/\s+/g,'-').toLowerCase();
  
  if(!meetId || meetId !== newId) {
    meetId = newId;
    const url = location.origin + location.pathname + "?meet=" + meetId;
    history.pushState({}, '', url);
    db.ref("tournaments/" + meetId).update({
      name, 
      createdAt: Date.now(),
      players, 
      rounds: allRounds
    });
  } else {
    db.ref("tournaments/" + meetId).update({ name });
  }
  alert("Settings Saved.");
}

// --- PLAYER LOGIC ---
function addPlayer() {
  if(!meetId) return alert("Initialize Tournament first.");
  if(localStorage.getItem("joined_" + meetId)) return alert("You've already joined.");
  
  const name = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!name || players.includes(name)) return alert("Invalid name.");
  
  players.push(name);
  localStorage.setItem("joined_" + meetId, "true");
  saveData();
  document.getElementById("playerInput").value = "";
}

function saveData() {
  if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds });
}

function renderPlayers() {
  document.getElementById("playerCount").innerText = players.length;
  document.getElementById("playersList").innerHTML = players.map(p => 
    `<span class="bg-white border px-4 py-2 rounded-full text-[11px] font-bold uppercase text-slate-500 shadow-sm">${p}</span>`
  ).join("");
}

function renderAdminRoster() {
  document.getElementById("adminRoster").innerHTML = players.map((p, i) => `
    <div class="flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100">
      <span class="text-xs font-bold uppercase">${p}</span>
      <button onclick="removePlayer(${i})" class="text-red-500 text-[10px] font-bold">REMOVE</button>
    </div>
  `).join("");
}

function removePlayer(i) {
  if(confirm("Delete player?")) { players.splice(i,1); saveData(); }
}

// --- MATCH LOGIC ---
function generate20Rounds() {
  const courts = parseInt(document.getElementById("courtsInput").value);
  if(players.length < 4) return alert("Need 4 players minimum.");
  if(!confirm("Generate 20 new rounds? This resets current scores.")) return;

  allRounds = [];
  let lastPlayed = {};

  for(let r=0; r<20; r++) {
    let pool = [...players];
    // Shuffle
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    // Fair rest sort
    pool.sort((a,b) => (lastPlayed[a] === r-1 ? 1 : 0) - (lastPlayed[b] === r-1 ? 1 : 0));

    let matches = [];
    for(let c=0; c<courts; c++) {
      if(pool.length < 4) break;
      let p1 = pool.shift(), p2 = pool.shift(), p3 = pool.shift(), p4 = pool.shift();
      matches.push({ tA: [p1,p2], tB: [p3,p4], sA: "", sB: "" });
      [p1,p2,p3,p4].forEach(p => lastPlayed[p] = r);
    }
    allRounds.push(matches);
  }
  saveData();
}

function renderAllRounds() {
  const container = document.getElementById("allRoundsContainer");
  container.innerHTML = "";
  allRounds.forEach((r, i) => {
    let html = `<div class="space-y-4">
      <div class="flex items-center gap-4">
        <div class="h-[1px] flex-1 bg-slate-200"></div>
        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Round ${i+1}</span>
        <div class="h-[1px] flex-1 bg-slate-200"></div>
      </div>`;
    r.forEach((m, j) => {
      html += `
        <div class="match-card">
          <div class="team-block text-slate-800">${m.tA[0]}<br>${m.tA[1]}</div>
          <div class="flex items-center gap-2">
            <input class="score-input" value="${m.sA}" onchange="updateScore(${i},${j},'sA',this.value)">
            <span class="text-[9px] font-black text-slate-300">VS</span>
            <input class="score-input" value="${m.sB}" onchange="updateScore(${i},${j},'sB',this.value)">
          </div>
          <div class="team-block text-slate-800">${m.tB[0]}<br>${m.tB[1]}</div>
        </div>`;
    });
    container.innerHTML += html + "</div>";
  });
}

function updateScore(ri, mi, team, val) {
  val = parseInt(val);
  if(val !== 0 && val !== 1) return renderAllRounds();
  allRounds[ri][mi][team] = val;
  saveData();
}

function renderLeaderboard() {
  let s = {};
  players.forEach(p => s[p] = { w: 0, l: 0, pts: 0 });
  allRounds.forEach(r => r.forEach(m => {
    if(m.sA == 1) { m.tA.forEach(p=>{s[p].w++; s[p].pts+=3}); m.tB.forEach(p=>s[p].l++); }
    if(m.sB == 1) { m.tB.forEach(p=>{s[p].w++; s[p].pts+=3}); m.tA.forEach(p=>s[p].l++); }
  }));
  let sorted = Object.entries(s).sort((a,b) => b[1].pts - a[1].pts);
  document.getElementById("leaderboardBody").innerHTML = sorted.map(([n,v], i) => `
    <tr>
      <td class="py-5 px-6 font-black text-slate-300">#${i+1}</td>
      <td class="py-5 font-bold uppercase text-xs">${n}</td>
      <td class="py-5 text-center text-xs font-bold text-slate-400">${v.w}W-${v.l}L</td>
      <td class="py-5 text-right px-6 font-black text-blue-600">${v.pts}</td>
    </tr>
  `).join("");
}

function copyLink() {
  const el = document.getElementById("shareLink");
  el.select();
  document.execCommand('copy');
  alert("Link copied!");
}

loadTournament();
</script>
</body>
</html>
