<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena | Pro</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #0f172a; }
    .glass-card { background: white; border-radius: 28px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.05); }
    .match-card { background: white; border-radius: 24px; padding: 20px; border: 1px solid #e2e8f0; transition: all 0.3s; }
    .match-active { border-color: #3b82f6; background: #eff6ff; ring: 4px ring-blue-50; }
    .team-btn { flex: 1; padding: 12px; border-radius: 16px; border: 2px solid #f1f5f9; text-align: center; cursor: pointer; background: white; }
    .team-btn.winner { background: #22c55e; border-color: #16a34a; color: white; font-weight: 800; }
    .nav-tab { flex: 1; text-align: center; padding: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; border-radius: 14px; color: #94a3b8; }
    .nav-tab.active { background: white; color: #3b82f6; box-shadow: 0 4px 12px -2px rgb(59 130 246 / 0.15); }
    .status-pill { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 99px; text-transform: uppercase; }
    .ready-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; }
    .away-badge { background: #f1f5f9; color: #94a3b8; padding: 2px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; }
    .locked-btn { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
  </style>
</head>
<body>

<div class="sticky top-0 z-50 bg-slate-50/90 backdrop-blur-md px-5 py-4 border-b border-slate-100">
  <div class="max-w-xl mx-auto flex bg-slate-200/50 p-1 rounded-2xl">
    <button onclick="switchTab('arena')" id="tab-arena" class="nav-tab active">Arena Hub</button>
    <button onclick="switchTab('stats')" id="tab-stats" class="nav-tab">Standings</button>
  </div>
</div>

<div class="max-w-xl mx-auto px-5 py-6 space-y-8">
  <div class="text-center">
    <div class="text-4xl font-black tracking-tighter text-slate-900">PADELPILOT <span class="text-blue-600">ARENA</span></div>
    <div id="devIndicator" class="hidden text-red-500 text-[10px] font-black uppercase mt-2 bg-red-50 px-3 py-1 rounded-full border border-red-100 inline-block tracking-widest text-center">Admin Access</div>
  </div>

  <div id="view-arena" class="space-y-8">
    <div id="infoDisplay" class="hidden glass-card border-blue-50 bg-blue-50/30 text-center py-4">
        <div class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1 text-center">Match Details</div>
        <div class="flex justify-around items-center">
            <div>
                <div class="text-[9px] font-bold text-slate-400 uppercase">Location</div>
                <div id="locText" class="font-bold text-slate-700">---</div>
            </div>
            <div class="h-8 w-[1px] bg-blue-100"></div>
            <div>
                <div class="text-[9px] font-bold text-slate-400 uppercase">Start Time</div>
                <div id="timeText" class="font-bold text-slate-700">---</div>
            </div>
        </div>
    </div>

    <section id="setupArea" class="glass-card space-y-4">
      <input id="tournamentName" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none font-bold" placeholder="Tournament Name">
      <div class="grid grid-cols-2 gap-4">
        <input id="tournamentLocation" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none" placeholder="Location">
        <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl bg-slate-50 outline-none">
      </div>
      <button onclick="createTournament()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Lock & Initialize</button>
    </section>

    <div id="shareSection" class="hidden glass-card flex gap-2">
      <input id="shareLink" class="flex-1 p-3 border rounded-xl text-[10px] bg-slate-50 text-slate-400 truncate" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-5 rounded-xl text-xs font-bold">Copy Link</button>
    </div>

    <div class="space-y-3">
      <div class="flex gap-2">
        <input id="playerInput" class="flex-1 p-5 border rounded-2xl text-lg outline-none focus:ring-2 ring-blue-100" placeholder="Enter Name">
        <button onclick="addPlayer()" class="bg-blue-600 text-white px-8 rounded-2xl font-bold shadow-lg shadow-blue-100">Join</button>
      </div>
      <div class="glass-card">
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Players (<span id="totalRegCount">0</span>)</div>
        <div id="playersList" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
      </div>
    </div>

    <div class="glass-card">
      <div class="flex justify-between items-center mb-4 text-xs font-black uppercase">
        <h3 class="text-blue-500">Waiting Bench</h3>
        <span class="bg-blue-50 text-blue-600 px-3 py-1 rounded-lg"><span id="benchCount">0</span> Ready</span>
      </div>
      <div id="benchList" class="grid grid-cols-2 gap-2"></div>
    </div>

    <div class="glass-card space-y-4 text-center border-orange-100 shadow-orange-50/50 shadow-lg">
      <div class="flex justify-between items-center px-2">
        <label class="font-bold text-slate-700">Courts Available</label>
        <input id="courtsInput" type="number" min="1" value="1" class="w-16 p-2 border rounded-xl text-center font-bold text-orange-600 bg-orange-50">
      </div>
      <button id="rotateBtn" onclick="smartRotate()" class="w-full bg-orange-500 text-white py-5 rounded-2xl font-black text-lg shadow-md uppercase tracking-tight transition active:scale-95">Generate Next Rotation</button>
      <div id="lockNotice" class="hidden text-[9px] font-black text-orange-400 uppercase tracking-widest text-center">Locked until start time</div>
    </div>

    <div id="allRoundsContainer" class="space-y-6 pb-20"></div>
  </div>

  <div id="view-stats" class="hidden">
    <div class="bg-white border rounded-[32px] overflow-hidden shadow-sm">
      <div class="p-6 bg-slate-50 border-b flex justify-between items-center">
        <h2 class="font-black uppercase tracking-tighter text-xl">Standings</h2>
        <span class="text-[10px] bg-blue-100 text-blue-600 px-3 py-1 rounded-full font-bold uppercase text-center">3 PTS / Win</span>
      </div>
      <table class="w-full">
        <thead>
          <tr class="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/50 border-b">
            <th class="px-6 py-3 text-center">Rank</th>
            <th class="px-6 py-3 text-left">Player</th>
            <th class="px-6 py-3 text-center">W / L</th>
            <th class="px-6 py-3 text-right">Points</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody" class="divide-y divide-slate-100"></tbody>
      </table>
    </div>
  </div>

  <div class="text-center py-10 opacity-30">
    <button onclick="unlockDev()" class="text-[10px] font-bold uppercase tracking-[0.4em]">Developer Access</button>
    <div id="adminResetContainer" class="hidden mt-4 flex justify-center gap-2">
        <button onclick="masterReset()" class="text-[10px] text-red-500 font-bold border border-red-100 px-4 py-2 rounded-full">Reset Everything</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = null, players = [], allRounds = [], registeredIPs = [], isAdmin = false, userIP = "", startTime = "";
fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => userIP = d.ip);

function loadArena() {
  const params = new URLSearchParams(location.search);
  if (params.get("meet")) {
    meetId = params.get("meet");
    document.getElementById("setupArea").classList.add("hidden");
    document.getElementById("shareSection").classList.remove("hidden");
    document.getElementById("shareLink").value = window.location.href;
    db.ref("tournaments/" + meetId).on("value", snap => {
      const data = snap.val() || {};
      players = data.players || [];
      allRounds = data.rounds || [];
      registeredIPs = data.registeredIPs || [];
      startTime = data.time || "";
      if(data.location) {
          document.getElementById("infoDisplay").classList.remove("hidden");
          document.getElementById("locText").innerText = data.location;
          document.getElementById("timeText").innerText = data.time;
      }
      checkTimeLock();
      renderAll();
    });
  }
}

function checkTimeLock() {
    if (isAdmin || !startTime) return;
    const now = new Date();
    const [h, m] = startTime.split(':');
    const target = new Date(); target.setHours(h, m, 0, 0);
    const isLocked = now < target;
    const btn = document.getElementById("rotateBtn");
    const notice = document.getElementById("lockNotice");
    if(isLocked) { btn.disabled = true; btn.classList.add("locked-btn"); notice.classList.remove("hidden"); }
    else { btn.disabled = false; btn.classList.remove("locked-btn"); notice.classList.add("hidden"); }
}
setInterval(checkTimeLock, 60000);

function smartRotate() {
  const courts = parseInt(document.getElementById("courtsInput").value);
  let busy = [];
  allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); }));
  
  let justPlayed = [];
  if (allRounds.length > 0) {
    allRounds[allRounds.length - 1].forEach(m => { justPlayed.push(...m.tA, ...m.tB); });
  }

  let available = players.filter(p => p.checkedIn && !busy.includes(p.name));
  
  // PRIMARY SORT: Prioritize players with fewer games played overall
  available.sort((a, b) => (a.gamesPlayed || 0) - (b.gamesPlayed || 0));

  // SECONDARY FILTER: Separate those who rested vs those who just played
  let fresh = available.filter(p => !justPlayed.includes(p.name));
  let tired = available.filter(p => justPlayed.includes(p.name));

  // SHUFFLE inside groups for random pairings
  fresh.sort(() => Math.random() - 0.5);
  tired.sort(() => Math.random() - 0.5);

  let queue = [...fresh, ...tired];
  if (queue.length < 4) return alert("Not enough READY players!");

  let newMatches = [];
  for(let i=0; i < courts; i++) {
    if(queue.length >= 4) {
      newMatches.push({ tA: [queue.shift().name, queue.shift().name], tB: [queue.shift().name, queue.shift().name], sA: "", sB: "", status: "waiting" });
    }
  }
  if(newMatches.length > 0) { allRounds.push(newMatches); saveData(); }
}

function renderLeaderboard() {
  let stats = {};
  players.forEach(p => { stats[p.name] = { w: 0, l: 0, pts: 0, t: 0 }; });
  allRounds.forEach(r => r.forEach(m => {
    if (m.status === "finished") {
      const awon = m.sA === "1", bwon = m.sB === "1";
      m.tA.forEach(p => { if(stats[p]) { stats[p].t++; if(awon){stats[p].pts+=3;stats[p].w++;} else if(bwon)stats[p].l++; }});
      m.tB.forEach(p => { if(stats[p]) { stats[p].t++; if(bwon){stats[p].pts+=3;stats[p].w++;} else if(awon)stats[p].l++; }});
    }
  }));
  let sorted = Object.entries(stats).sort((a, b) => b[1].pts - a[1].pts || b[1].w - a[1].w);
  const tbody = document.getElementById("leaderboardBody");
  if (!tbody) return;
  tbody.innerHTML = sorted.map(([n, d], i) => {
    let r = `#${i+1}`, m = "text-slate-300", bg = "";
    if(i===0){ r="🥇"; m="text-2xl"; bg="bg-yellow-50/20"; }
    else if(i===1){ r="🥈"; m="text-2xl"; }
    else if(i===2){ r="🥉"; m="text-2xl"; }
    return `<tr class="${bg}"><td class="px-6 py-5 text-center font-black ${m}">${r}</td><td class="px-6 py-5"><div class="font-bold uppercase text-slate-800 text-sm">${n}</div><div class="text-[9px] font-bold text-slate-400 uppercase">${d.t} Games</div></td><td class="px-6 py-5 text-center font-bold text-[11px]"><span class="text-green-600">${d.w}W</span> <span class="text-slate-400 ml-1">${d.l}L</span></td><td class="px-6 py-5 text-right font-black text-blue-600 text-lg">${d.pts}</td></tr>`;
  }).join("");
}

function createTournament() {
  const n = document.getElementById("tournamentName").value.trim();
  const l = document.getElementById("tournamentLocation").value.trim();
  const t = document.getElementById("tournamentTime").value;
  if(!n) return;
  meetId = n.replace(/\s+/g,'-').toLowerCase();
  db.ref("tournaments/" + meetId).update({ name: n, location: l, time: t, createdAt: Date.now() }).then(() => { window.location.search = "?meet=" + meetId; });
}

function addPlayer() {
  if(!isAdmin && registeredIPs.includes(userIP)) return alert("Already joined!");
  const n = document.getElementById("playerInput").value.trim().toLowerCase();
  if(!n || players.some(p => p.name === n)) return;
  players.push({ name: n, checkedIn: false, gamesPlayed: 0 });
  if(!isAdmin) registeredIPs.push(userIP);
  saveData();
  document.getElementById("playerInput").value = "";
}

function toggleCheckIn(i) { players[i].checkedIn = !players[i].checkedIn; saveData(); }
function toggleMatch(ri, mi) { const m = allRounds[ri][mi]; if (m.status === "waiting") m.status = "playing"; saveData(); }
function selectWinner(ri, mi, team) {
  const m = allRounds[ri][mi]; m.sA = (team === 'A') ? "1" : "0"; m.sB = (team === 'B') ? "1" : "0"; m.status = "finished";
  [...m.tA, ...m.tB].forEach(pName => { const p = players.find(x => x.name === pName); if(p) p.gamesPlayed = (p.gamesPlayed || 0) + 1; });
  saveData();
}

function renderPlayers() {
  document.getElementById("totalRegCount").innerText = players.length;
  document.getElementById("playersList").innerHTML = players.map((p, i) => `<div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50"><div class="flex items-center gap-3"><span class="text-sm font-bold uppercase">${p.name}</span>${p.checkedIn ? '<span class="ready-badge">READY</span>' : '<span class="away-badge">AWAY</span>'}</div><div class="flex gap-2"><button onclick="toggleCheckIn(${i})" class="text-[9px] font-black px-2 py-1 bg-white border rounded shadow-sm">${p.checkedIn ? 'GO AWAY' : 'I\'M READY'}</button>${isAdmin ? `<button onclick="removePlayer(${i})" class="text-red-400 px-2">✕</button>` : ''}</div></div>`).join("");
}

function renderBench() {
    let busy = []; allRounds.forEach(r => r.forEach(m => { if(m.status === "playing") busy.push(...m.tA, ...m.tB); }));
    const resting = players.filter(p => p.checkedIn && !busy.includes(p.name));
    document.getElementById("benchCount").innerText = resting.length;
    document.getElementById("benchList").innerHTML = resting.map(p => `<div class="bg-blue-50/50 border border-blue-100 p-3 rounded-2xl text-center text-[10px] font-black uppercase text-blue-600">${p.name}</div>`).join("");
}

function renderAllRounds() {
  const c = document.getElementById("allRoundsContainer"); c.innerHTML = "";
  allRounds.slice().reverse().forEach((r, riInv) => {
    const ri = allRounds.length - 1 - riInv;
    r.forEach((m, mi) => {
      const isP = m.status === "playing", isF = m.status === "finished";
      c.innerHTML += `<div class="match-card ${isP ? 'match-active shadow-lg' : ''} space-y-4"><div class="flex justify-between items-center"><span class="status-pill ${isF ? 'bg-slate-100 text-slate-400' : isP ? 'bg-blue-600 text-white' : 'bg-orange-100 text-orange-600'}">${m.status}</span>${!isF ? `<button onclick="toggleMatch(${ri},${mi})" class="text-[10px] font-black uppercase text-blue-500">${isP ? '' : 'START MATCH →'}</button>` : ''}</div><div class="flex gap-2"><button onclick="${isP ? `selectWinner(${ri},${mi},'A')` : ''}" class="team-btn ${m.sA === '1' ? 'winner' : ''} text-[11px] font-bold uppercase truncate">${m.tA[0]} & ${m.tA[1]}</button><button onclick="${isP ? `selectWinner(${ri},${mi},'B')` : ''}" class="team-btn ${m.sB === '1' ? 'winner' : ''} text-[11px] font-bold uppercase truncate">${m.tB[0]} & ${m.tB[1]}</button></div></div>`;
    });
  });
}

function unlockDev() { if(prompt("Pass:") === "padel-dev-123") { isAdmin = true; document.getElementById("devIndicator").classList.remove("hidden"); document.getElementById("adminResetContainer").classList.remove("hidden"); checkTimeLock(); renderAll(); } }
function switchTab(t) { document.getElementById('view-arena').classList.toggle('hidden', t !== 'arena'); document.getElementById('view-stats').classList.toggle('hidden', t !== 'stats'); document.getElementById('tab-arena').classList.toggle('active', t === 'arena'); document.getElementById('tab-stats').classList.toggle('active', t === 'stats'); }
function renderAll() { renderPlayers(); renderBench(); renderAllRounds(); renderLeaderboard(); }
function saveData() { if(meetId) db.ref("tournaments/" + meetId).update({ players, rounds: allRounds, registeredIPs }); }
function removePlayer(i) { players.splice(i,1); saveData(); }
function masterReset() { if(confirm("Wipe?")) { db.ref("tournaments/" + meetId).set(null); location.href = location.origin + location.pathname; } }
function copyLink() { const el = document.getElementById("shareLink"); el.select(); document.execCommand('copy'); alert("Copied!"); }

loadArena();
</script>
</body>
</html>
