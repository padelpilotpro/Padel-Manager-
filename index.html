<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PadelPilot Arena</title>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #f8fafc;
      font-family: Inter, system-ui, sans-serif;
      color: #0f172a;
    }
    .match-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
  </style>
</head>

<body>

<div class="max-w-4xl mx-auto px-5 py-8 space-y-8">

  <!-- HEADER -->
  <div class="text-center py-6 space-y-1">
    <div class="text-3xl font-black tracking-widest text-gray-900">PADELPILOT</div>
    <div class="text-blue-600 text-2xl font-bold">Arena</div>
  </div>

  <!-- TOURNAMENT SETUP -->
  <div class="bg-white border rounded-2xl p-6 shadow-sm space-y-5">
    <div>
      <label class="text-sm font-semibold text-gray-600 block mb-1">Tournament Name</label>
      <input id="tournamentName" class="w-full p-4 border rounded-2xl text-lg" placeholder="e.g. Thursday Night Padel">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-semibold text-gray-600 block mb-1">Location</label>
        <input id="tournamentLocation" class="w-full p-4 border rounded-2xl" placeholder="e.g. Al Ain Club">
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-600 block mb-1">Time</label>
        <input id="tournamentTime" type="time" class="w-full p-4 border rounded-2xl">
      </div>
    </div>

    <button onclick="createTournament()" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-lg transition">
      Create / Save Tournament
    </button>
  </div>

  <!-- SHARE LINK -->
  <div class="bg-white border rounded-2xl p-5 shadow-sm">
    <div class="text-sm text-gray-500 mb-2">Share this link with players</div>
    <div class="flex gap-2">
      <input id="shareLink" class="flex-1 p-4 border rounded-2xl text-sm bg-gray-50" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-8 rounded-2xl font-semibold">Copy</button>
    </div>
  </div>

  <!-- ADD PLAYER -->
  <div class="flex gap-2">
    <input id="playerInput" class="flex-1 p-4 border rounded-2xl" placeholder="Enter player name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-6 rounded-2xl font-medium">Add</button>
    <button onclick="addMe()" class="bg-gray-200 px-6 rounded-2xl font-medium">Add Me</button>
  </div>

  <!-- PLAYERS -->
  <div class="bg-white rounded-2xl border shadow-sm p-5">
    <div class="font-semibold mb-3 text-gray-700">Players • <span id="playerCount">0</span></div>
    <div id="playersList" class="space-y-2 text-sm"></div>
  </div>

  <!-- RESTING -->
  <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-5">
    <div class="text-sm font-semibold text-yellow-700 mb-1">Currently Resting</div>
    <div id="restingPlayers" class="text-yellow-800">None</div>
  </div>

  <!-- ACTION -->
  <button onclick="generateMatches()" 
          class="w-full bg-gradient-to-r from-yellow-400 to-orange-400 py-5 rounded-2xl font-bold text-lg shadow-sm">
    🎲 Generate Round
  </button>

  <!-- MATCHES -->
  <div id="matchesContainer" class="space-y-4"></div>

</div>

<script>
// ============== YOUR FIREBASE CONFIG ==============
const firebaseConfig = {
  apiKey: "AIzaSyAw5Y0Z8THy2guZ8BK7Q0D5LkHNeP9",
  authDomain: "padelpilot-b8e47.firebaseapp.com",
  databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
  projectId: "padelpilot-b8e47",
  storageBucket: "padelpilot-b8e47.appspot.com",
  messagingSenderId: "1047531628612",
  appId: "1:1047531628612:web:0ee8f8bd27113c41f9c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = "default-session";
let players = [];
let matches = [];
let resting = [];

const EXPIRY = 48 * 60 * 60 * 1000; // 48 hours

// Load data
function load() {
  const params = new URLSearchParams(window.location.search);
  if (params.has("meet")) {
    meetId = params.get("meet");
  }

  db.ref("tournaments/" + meetId).on("value", (snap) => {
    const data = snap.val();
    if (!data) return;

    if (Date.now() - (data.timestamp || 0) > EXPIRY) {
      db.ref("tournaments/" + meetId).set(null);
      alert("Old session expired and has been reset.");
      return;
    }

    players = data.players || [];
    matches = data.matches || [];
    resting = data.resting || [];

    document.getElementById("tournamentName").value = data.name || "";
    document.getElementById("tournamentLocation").value = data.location || "";
    document.getElementById("tournamentTime").value = data.time || "";

    document.getElementById("shareLink").value = window.location.href;

    renderPlayers();
    renderMatches();
    renderResting();
    updatePlayerCount();
  });
}

// Create / Save Tournament
function createTournament() {
  const name = document.getElementById("tournamentName").value.trim();
  if (!name) return alert("Please enter a tournament name");

  meetId = name.replace(/\s+/g, '-').toLowerCase().replace(/[^a-z0-9-]/g, '');

  db.ref("tournaments/" + meetId).update({
    name: name,
    location: document.getElementById("tournamentLocation").value.trim(),
    time: document.getElementById("tournamentTime").value,
    players: players,
    matches: matches,
    resting: resting,
    timestamp: Date.now()
  }).then(() => {
    const newUrl = window.location.origin + window.location.pathname + "?meet=" + meetId;
    window.history.pushState({}, "", newUrl);
    document.getElementById("shareLink").value = newUrl;
    alert("✅ Tournament saved successfully!\nShare the link with players.");
  }).catch(err => alert("Save failed: " + err.message));
}

// Add Player
function addPlayer() {
  let name = document.getElementById("playerInput").value.trim();
  if (!name) return;
  name = name.toLowerCase();

  if (!players.includes(name)) {
    players.push(name);
    saveData();
  }
  document.getElementById("playerInput").value = "";
  renderPlayers();
  updatePlayerCount();
}

// Add Me
function addMe() {
  let name = localStorage.getItem("myName") || prompt("Enter your name:");
  if (!name) return;
  name = name.trim().toLowerCase();
  localStorage.setItem("myName", name);

  if (!players.includes(name)) {
    players.push(name);
    saveData();
  }
  renderPlayers();
  updatePlayerCount();
}

// Save to Firebase
function saveData() {
  db.ref("tournaments/" + meetId).update({
    players: players,
    matches: matches,
    resting: resting,
    timestamp: Date.now()
  });
}

// Render Players
function renderPlayers() {
  const el = document.getElementById("playersList");
  el.innerHTML = players.map((p, i) => `
    <div class="flex justify-between items-center bg-gray-50 px-4 py-3 rounded-xl">
      <span>${i+1}. ${capitalize(p)}</span>
    </div>
  `).join("");
}

function updatePlayerCount() {
  document.getElementById("playerCount").textContent = players.length;
}

// Generate Matches
function generateMatches() {
  if (players.length < 4) return alert("Need at least 4 players");

  let shuffled = [...players].sort(() => 0.5 - Math.random());
  let courts = Math.floor(players.length / 4);
  let totalPlaying = courts * 4;

  resting = players.length > totalPlaying ? shuffled.slice(totalPlaying) : [];
  let playing = shuffled.slice(0, totalPlaying);

  matches = [];

  for (let i = 0; i < playing.length; i += 4) {
    matches.push({
      teamA: [playing[i], playing[i+1]],
      teamB: [playing[i+2], playing[i+3]]
    });
  }

  renderResting();
  saveData();
  renderMatches();
}

// Render Resting
function renderResting() {
  const el = document.getElementById("restingPlayers");
  el.innerText = resting.length ? resting.map(capitalize).join(", ") : "None";
}

// Render Matches
function renderMatches() {
  const el = document.getElementById("matchesContainer");
  if (!matches.length) {
    el.innerHTML = `<div class="text-center py-12 text-gray-400">No matches generated yet</div>`;
    return;
  }

  el.innerHTML = matches.map((m, i) => `
    <div class="match-card">
      <div class="text-right font-medium">
        ${capitalize(m.teamA[0])}<br>
        ${capitalize(m.teamA[1])}
      </div>
      <div class="text-center text-gray-400 text-sm">
        Court ${i+1}<br>
        <span class="font-bold text-lg text-black">VS</span>
      </div>
      <div class="font-medium">
        ${capitalize(m.teamB[0])}<br>
        ${capitalize(m.teamB[1])}
      </div>
    </div>
  `).join("");
}

function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("✅ Link copied!");
}

function capitalize(name) {
  return name.charAt(0).toUpperCase() + name.slice(1);
}

// Initialize
load();
</script>

</body>
</html>
