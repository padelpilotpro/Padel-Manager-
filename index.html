<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PadelPilot Arena</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: #f8fafc;
  font-family: Inter, sans-serif;
  color: #0f172a;
}
.match-card {
  background: white;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid #e5e7eb;
}
</style>
</head>

<body>

<div class="max-w-4xl mx-auto px-5 py-8 space-y-8">

  <!-- HEADER -->
  <div class="text-center space-y-2">
    <div class="text-3xl font-extrabold text-blue-600">Americano</div>
    <div class="text-gray-500">Padel Session</div>
  </div>

  <!-- SHARE -->
  <div class="bg-white border rounded-2xl p-4 shadow-sm">
    <div class="text-sm text-gray-500 mb-2">Share link</div>
    <div class="flex gap-2">
      <input id="shareLink" class="flex-1 p-3 border rounded-xl text-sm" readonly />
      <button onclick="copyLink()" class="bg-blue-600 text-white px-4 rounded-xl font-semibold">Copy</button>
    </div>
  </div>

  <!-- ADD PLAYER -->
  <div class="flex gap-2">
    <input id="playerInput" class="flex-1 p-3 border rounded-xl" placeholder="Enter name">
    <button onclick="addPlayer()" class="bg-blue-600 text-white px-4 rounded-xl">Add</button>
    <button onclick="addMe()" class="bg-gray-200 px-4 rounded-xl">Add Me</button>
  </div>

  <!-- PLAYERS -->
  <div class="bg-white rounded-2xl border shadow-sm p-4">
    <div id="playersList" class="space-y-1 text-sm"></div>
  </div>

  <!-- RESTING -->
  <div class="bg-yellow-50 border border-yellow-200 rounded-2xl p-4">
    <div class="text-sm font-semibold text-yellow-700">Resting Players</div>
    <div id="restingPlayers">None</div>
  </div>

  <!-- ACTION -->
  <button onclick="generateMatches()" class="w-full bg-gradient-to-r from-yellow-400 to-orange-400 py-4 rounded-2xl font-bold">
    🎲 Generate Round
  </button>

  <!-- MATCHES -->
  <div id="matchesContainer" class="space-y-4"></div>

</div>

<script>
// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let meetId = "default-session";
let players = [];
let matches = [];
let restHistory = {};
let teammateHistory = {};

const EXPIRY = 48 * 60 * 60 * 1000;

// INIT
load();

// LOAD DATA
function load() {
  const ref = db.ref("tournaments/" + meetId);

  ref.on("value", snap => {
    let data = snap.val();
    if (!data) return;

    // ⏱️ Expiry check
    if (Date.now() - data.timestamp > EXPIRY) {
      ref.set({
        players: [],
        matches: [],
        timestamp: Date.now()
      });
      alert("Session reset after 48h");
      return;
    }

    players = data.players || [];
    matches = data.matches || [];

    renderPlayers();
    renderMatches();
  });

  document.getElementById("shareLink").value =
    window.location.href;
}

// ADD PLAYER
function addPlayer() {
  let name = document.getElementById("playerInput").value.trim().toLowerCase();
  if (!name) return;

  if (!players.includes(name)) {
    players.push(name);
    save();
  }

  document.getElementById("playerInput").value = "";
}

// ADD ME
function addMe() {
  let name = localStorage.getItem("name") || prompt("Enter your name");
  if (!name) return;

  name = name.toLowerCase();
  localStorage.setItem("name", name);

  if (!players.includes(name)) {
    players.push(name);
    save();
  }
}

// SAVE
function save() {
  db.ref("tournaments/" + meetId).set({
    players,
    matches,
    timestamp: Date.now()
  });
}

// RENDER PLAYERS
function renderPlayers() {
  const el = document.getElementById("playersList");
  el.innerHTML = players.map((p, i) => `<div>${i+1}. ${capitalize(p)}</div>`).join("");
}

// GENERATE MATCHES
function generateMatches() {
  let shuffled = [...players].sort(() => 0.5 - Math.random());

  let courts = Math.floor(players.length / 4);
  let totalPlaying = courts * 4;

  let resting = [];
  if (players.length > totalPlaying) {
    resting = shuffled.slice(totalPlaying);
    updateRest(resting);
  }

  let playing = shuffled.slice(0, totalPlaying);

  matches = [];

  for (let i = 0; i < playing.length; i += 4) {
    let teamA = [playing[i], playing[i+1]];
    let teamB = [playing[i+2], playing[i+3]];

    saveTeammates(teamA);
    saveTeammates(teamB);

    matches.push({ teamA, teamB });
  }

  renderResting(resting);
  save();
}

// REST ROTATION
function updateRest(list) {
  list.forEach(p => {
    restHistory[p] = (restHistory[p] || 0) + 1;
  });
}

// TEAM HISTORY
function saveTeammates(team) {
  let [a, b] = team;
  if (!teammateHistory[a]) teammateHistory[a] = [];
  if (!teammateHistory[b]) teammateHistory[b] = [];
  teammateHistory[a].push(b);
  teammateHistory[b].push(a);
}

// RENDER REST
function renderResting(list) {
  document.getElementById("restingPlayers").innerText =
    list.length ? list.map(capitalize).join(", ") : "None";
}

// RENDER MATCHES
function renderMatches() {
  const el = document.getElementById("matchesContainer");

  if (!matches.length) {
    el.innerHTML = `<div class="text-center text-gray-400">No matches yet</div>`;
    return;
  }

  el.innerHTML = matches.map((m, i) => `
    <div class="match-card">
      <div>${capitalize(m.teamA[0])}<br>${capitalize(m.teamA[1])}</div>
      <div class="text-gray-400 text-sm">Court ${i+1}<br>VS</div>
      <div>${capitalize(m.teamB[0])}<br>${capitalize(m.teamB[1])}</div>
    </div>
  `).join("");
}

// COPY LINK
function copyLink() {
  navigator.clipboard.writeText(window.location.href);
  alert("Link copied");
}

// UTIL
function capitalize(name) {
  return name.charAt(0).toUpperCase() + name.slice(1);
}
</script>

</body>
</html>
