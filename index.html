<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelPilot Arena</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#f8fafc; font-family:Inter,sans-serif; }
.match-card { background:white; border-radius:20px; padding:20px; display:flex; justify-content:space-between; align-items:center; border:1px solid #e5e7eb; }
.team { width:35%; text-align:center; font-weight:600; }
.score { width:60px; height:50px; text-align:center; font-size:20px; border:2px solid #e5e7eb; border-radius:10px; }
</style>
</head>

<body>

<div class="max-w-4xl mx-auto p-6 space-y-8">

<h1 class="text-3xl font-bold text-center">PADELPILOT ARENA</h1>

<!-- Developer password -->
<input id="devPassword" type="password" placeholder="Developer Password (for editing tournament)" class="w-full p-4 border rounded-xl">

<!-- Tournament -->
<input id="tName" placeholder="Tournament Name" class="w-full p-4 border rounded-xl">
<input id="tLocation" placeholder="Location" class="w-full p-4 border rounded-xl">
<input id="tTime" type="time" class="w-full p-4 border rounded-xl">
<button onclick="createTournament()" class="w-full bg-blue-600 text-white p-4 rounded-xl">Create / Update Tournament</button>

<!-- Share -->
<input id="shareLink" readonly class="w-full p-3 border rounded-xl" placeholder="Share link will appear here">

<!-- Player -->
<div class="flex gap-2">
  <input id="playerInput" placeholder="Your name" class="flex-1 p-4 border rounded-xl">
  <button onclick="addPlayer()" class="bg-blue-600 text-white px-6 rounded-xl">Add</button>
</div>

<div id="players"></div>

<!-- Courts -->
<input id="courts" type="number" value="1" min="1" class="w-full p-4 border rounded-xl">

<button onclick="generateRounds()" class="w-full bg-orange-500 text-white p-4 rounded-xl">Generate 20 Rounds</button>

<div id="rounds"></div>

<h2 class="text-2xl font-bold">Leaderboard</h2>
<div id="leaderboard"></div>

</div>

<script>
// Firebase
const firebaseConfig = {
 apiKey: "AIzaSyAw5YOZ0THKHy2ugrBBKTQD5lkHNaP9Z_A",
 authDomain: "padelpilot-b8e47.firebaseapp.com",
 databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
 projectId: "padelpilot-b8e47"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Developer password (change to your real secret)
const DEV_PASSWORD = "Ziy@3922";

let meetId = null;
let players = [];
let rounds = [];
let tournamentCreated = false; // tracks if this tournament already exists (created or loaded)


// Create / update tournament
function createTournament(){
 const name = document.getElementById("tName").value.trim();
 const locationVal = document.getElementById("tLocation").value.trim();
 const timeVal = document.getElementById("tTime").value;
 const devPass = document.getElementById("devPassword").value;

 if(!name) return alert("Enter tournament name");

 // Generate meetId from name
 const newMeetId = name.replace(/\s+/g,'-').toLowerCase();

 // If this is the first time (no tournament yet in this session)
 // OR meetId is different (new tournament), allow creation without password
 if(!tournamentCreated || meetId !== newMeetId){
   meetId = newMeetId;

   const url = location.origin + location.pathname + "?meet="+meetId;
   history.pushState({},'',url);
   document.getElementById("shareLink").value = url;

   db.ref("tournaments/"+meetId).update({
    name,
    location: locationVal,
    time: timeVal,
    players,
    rounds
   });

   tournamentCreated = true;
   alert("Tournament created.");
   return;
 }

 // If we reach here, a tournament already exists and we are editing it
 if(devPass !== DEV_PASSWORD){
   alert("Developer password required to edit existing tournament details.");
   return;
 }

 // Update only tournament meta, keep players and rounds intact
 db.ref("tournaments/"+meetId).update({
  name,
  location: locationVal,
  time: timeVal
 });

 alert("Tournament details updated without resetting players or rounds.");
}


// Load existing tournament from URL
function load(){
 const params = new URLSearchParams(location.search);
 if(params.get("meet")){
  meetId = params.get("meet");

  db.ref("tournaments/"+meetId).on("value", snap=>{
   const data = snap.val() || {};
   players = data.players || [];
   rounds = data.rounds || [];

   // Fill tournament fields if present
   if(data.name) document.getElementById("tName").value = data.name;
   if(data.location) document.getElementById("tLocation").value = data.location;
   if(data.time) document.getElementById("tTime").value = data.time;

   const url = location.origin + location.pathname + "?meet="+meetId;
   document.getElementById("shareLink").value = url;

   tournamentCreated = true;

   renderPlayers();
   renderRounds();
   renderLeaderboard();
  });
 }
}


// Add player (one per device, and only once globally)
function addPlayer(){
 if(!meetId) return alert("Create tournament first");

 if(localStorage.getItem("joined")) return alert("You already joined from this device");

 const nameRaw = document.getElementById("playerInput").value.trim();
 const name = nameRaw.toLowerCase();

 if(!name) return;
 if(players.includes(name)) return alert("This player name is already added.");

 players.push(name);
 localStorage.setItem("joined","true");

 save();
 document.getElementById("playerInput").value="";
}


// Save players and rounds
function save(){
 if(!meetId) return;
 db.ref("tournaments/"+meetId).update({
  players,
  rounds
 });
}


// Render players
function renderPlayers(){
 const playersDiv = document.getElementById("players");
 playersDiv.innerHTML = players
   .map(p=>`<div class="p-2 border-b text-sm">${p}</div>`)
   .join("");
}


// Generate 20 rounds with fair-ish resting and mixed teams
function generateRounds(){
 const courts = parseInt(document.getElementById("courts").value);
 if(players.length < 4) return alert("Need at least 4 players");
 if(!courts || courts < 1) return alert("Enter a valid number of courts");

 rounds = [];
 let lastPlayed = {};

 for(let r=0;r<20;r++){
  // fresh pool each round
  let pool = [...players];

  // Shuffle players to mix teams fairly
  for(let i = pool.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  // Sort so that players who just played last round are later in the pool
  pool.sort((a,b)=>(lastPlayed[a]===r-1?1:0)-(lastPlayed[b]===r-1?1:0));

  let matches=[];
  for(let i=0;i<courts;i++){
   if(pool.length<4) break;

   let p1=pool.shift();
   let p2=pool.shift();
   let p3=pool.shift();
   let p4=pool.shift();

   matches.push({A:[p1,p2],B:[p3,p4],sA:"",sB:""});

   [p1,p2,p3,p4].forEach(p=>lastPlayed[p]=r);
  }

  rounds.push(matches);
 }

 save();
 renderRounds();
}


// Render rounds
function renderRounds(){
 const el = document.getElementById("rounds");
 el.innerHTML="";

 rounds.forEach((r,i)=>{
  let html=`<h3 class="mt-4 mb-2 font-semibold">Round ${i+1}</h3>`;
  r.forEach((m,j)=>{
   html+=`
   <div class="match-card mb-3">
    <div class="team">${m.A[0]}<br>${m.A[1]}</div>
    <div class="flex items-center gap-2">
     <input class="score" value="${m.sA}" onchange="score(${i},${j},'A',this.value)">
     <span class="text-gray-500">vs</span>
     <input class="score" value="${m.sB}" onchange="score(${i},${j},'B',this.value)">
    </div>
    <div class="team">${m.B[0]}<br>${m.B[1]}</div>
   </div>`;
  });
  el.innerHTML+=html;
 });
}


// Score input (only 0 or 1 allowed)
function score(r,m,side,val){
 val=parseInt(val);
 if(val!==0 && val!==1){
   alert("Only 0 or 1 allowed.\n1 = 3 points, 0 = 0 points.");
   renderRounds(); // reset invalid input visually
   return;
 }

 rounds[r][m]["s"+side]=val;
 save();
 renderLeaderboard();
}


// Leaderboard
function renderLeaderboard(){
 let scores={};

 players.forEach(p=>scores[p]={w:0,l:0,pts:0});

 rounds.forEach(r=>{
  r.forEach(m=>{
   if(m.sA==1){
    m.A.forEach(p=>{scores[p].w++;scores[p].pts+=3});
    m.B.forEach(p=>scores[p].l++);
   }
   if(m.sB==1){
    m.B.forEach(p=>{scores[p].w++;scores[p].pts+=3});
    m.A.forEach(p=>scores[p].l++);
   }
  });
 });

 let sorted = Object.entries(scores).sort((a,b)=>b[1].pts-a[1].pts);

 document.getElementById("leaderboard").innerHTML = sorted.map(([name,s],i)=>`
  <div class="p-2 border-b text-sm">
    ${i+1}. <span class="font-semibold">${name}</span> - ${s.pts} pts (${s.w}W ${s.l}L)
  </div>
 `).join("");
}


load();
</script>

</body>
</html>
