<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Live Standings | PadelPilot</title>
</head>
<body class="bg-slate-900 text-white p-10">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-5xl font-black mb-10 text-center">LIVE <span class="text-blue-500">STANDINGS</span></h1>
    
    <div class="bg-slate-800 rounded-[40px] overflow-hidden border border-slate-700 shadow-2xl">
      <table class="w-full text-left">
        <thead class="bg-slate-700/50 text-slate-400 uppercase text-sm font-bold">
          <tr>
            <th class="p-8">Rank</th>
            <th>Player</th>
            <th class="text-center">Record</th>
            <th class="text-right p-8">Points</th>
          </tr>
        </thead>
        <tbody id="liveLeaderboard" class="text-2xl font-bold">
          </tbody>
      </table>
    </div>
  </div>

  <script>
    // USE THE SAME CONFIG FROM YOUR ARENA PAGE
    const firebaseConfig = {
      apiKey: "AiZaSyAKJywAbSKpKHqOs1a-_nQVBuQGkFmF4d4",
      authDomain: "padelpilot-b8e47.firebaseapp.com",
      databaseURL: "https://padelpilot-b8e47-default-rtdb.firebaseio.com",
      projectId: "padelpilot-b8e47"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Get the tournament ID from the URL (e.g., leaderboard.html?meet=my-tournament)
    const params = new URLSearchParams(location.search);
    const meetId = params.get("meet");

    if (meetId) {
      db.ref("tournaments/" + meetId).on("value", snap => {
        const data = snap.val() || {};
        const players = data.players || [];
        const allRounds = data.rounds || [];
        render(players, allRounds);
      });
    }

    function render(players, allRounds) {
      let stats = {};
      players.forEach(p => stats[p.name] = { w: 0, l: 0, pts: 0 });

      allRounds.forEach(r => r.forEach(m => {
        if(m.sA === "1") { 
            m.tA.forEach(p => { if(stats[p]) { stats[p].pts += 3; stats[p].w++; } });
            m.tB.forEach(p => { if(stats[p]) stats[p].l++; });
        }
        if(m.sB === "1") { 
            m.tB.forEach(p => { if(stats[p]) { stats[p].pts += 3; stats[p].w++; } });
            m.tA.forEach(p => { if(stats[p]) stats[p].l++; });
        }
      }));

      const sorted = Object.entries(stats).sort((a,b) => b[1].pts - a[1].pts);
      document.getElementById("liveLeaderboard").innerHTML = sorted.map(([name, v], i) => `
        <tr class="border-b border-slate-700">
          <td class="p-8 text-slate-500">#${i+1}</td>
          <td class="uppercase">${name}</td>
          <td class="text-center text-slate-400">${v.w}W - ${v.l}L</td>
          <td class="p-8 text-right text-blue-400 text-4xl">${v.pts}</td>
        </tr>
      `).join("");
    }
  </script>
</body>
</html>
